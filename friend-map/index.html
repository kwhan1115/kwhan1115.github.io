    /* A GROUP, BECAUSE THE TEXT CANNOT BE THE HANDLE. `.clabel` is
       pointer-events:none -- deliberately, so a wide label never swallows the
       click of a node behind it -- and the drag listener used to sit on that
       same element, so "drag a circle's label to move the whole circle" was
       dead from the day it was written. The group takes the listener, an
       invisible rect takes the pointer, the text stays inert.
       AND THE GROUP IS WHAT MOVES. The text used to carry absolute x/y that
       paint() rewrote every frame; a sibling rect cannot follow that. So the
       handle adopts the node idiom -- children at local 0,0, a transform on
       the group -- and the pad travels with the text by construction instead
       of by a second position that has to be kept in sync. */
    var h=el('g',{'class':'chandle',tabindex:0,role:'button',
                  transform:'translate('+l.x.toFixed(1)+','+l.y.toFixed(1)+')'});
    h.setAttribute('aria-label','Move the '+l.key+' group — '+l.n+' people');
    var pad=el('rect',{'class':'chit'});           /* sized once measured */
    h.appendChild(pad);
    var t=el('text',{'class':'clabel'});
    t.appendChild(document.createTextNode(l.key.toUpperCase()));
    var sp=el('tspan',{'class':'n',dx:6}); sp.textContent='('+l.n+')'; t.appendChild(sp);
    if(l.sub) t.setAttribute('opacity','.55');
    h.appendChild(t);
    h._l = l; h._pad = pad; h._tx = t;
    h.addEventListener('pointerdown', function(ev){
      ev.preventDefault();
      startDrag(ev, l.mem.map(function(p){ return p.name; })
                      .filter(function(n){ return cur[n] && n!==SELFNAME; }));
    });
    h.addEventListener('keydown', function(ev){
      /* dragging is a pointer gesture; from the keyboard the handle at least
         does something truthful -- it selects the circle through a member,
         which highlights that cluster and its ties. */
      if(ev.key==='Enter'||ev.key===' '){
        ev.preventDefault();
        var first=l.mem.filter(function(p){ return cur[p.name]; })[0];
        if(first) select(first.name);
      }
    });
    gL.appendChild(h); labelEls.push(t); handleEls.push(h);
  });
  /* measured, not estimated -- same reason as the node labels. ONE BOX, TWO
     JOBS: the rect the pointer hits and the body the solver separates are the
     same rectangle, so a bigger grab area cannot cost a node its own clicks.
     The bbox is LOCAL now (children sit at 0,0), so ox/oy are the offset
     directly rather than a difference against the label's own position. */
  for(var i=0;i<labelEls.length && i<LAB.length;i++){
    try{
      var bb=labelEls[i].getBBox(), la=LAB[i];
      la.ox = bb.x+bb.width/2; la.oy = bb.y+bb.height/2;
      la.hw = bb.width/2+CHIT_X; la.hh = bb.height/2+CHIT_Y;
      var pd = handleEls[i]._pad;
      pd.setAttribute('x', (bb.x-CHIT_X).toFixed(1));
      pd.setAttribute('y', (bb.y-CHIT_Y).toFixed(1));
      pd.setAttribute('width',  (bb.width+2*CHIT_X).toFixed(1));
      pd.setAttribute('height', (bb.height+2*CHIT_Y).toFixed(1));
    }catch(e){}
  }
}

var nodes={};
PEOPLE.forEach(function(p){
  var g = el('g',{'class':'node',tabindex:0,role:'button'});
  g.setAttribute('aria-label', p.name+' — '+(p.closeness||'ring not asked'));
  var ring = p.closeness, isSelf = p.relation==='self', isFam = p.relation==='family';
  var pend = p.capture_status==='pending';
  var fill, stroke, sw=1.6, shape;
  if(isSelf){ fill='var(--self)'; stroke='var(--self)'; }
  else if(!ring){ fill='none'; stroke='var(--none)'; sw=1.4; }
  else if(ring==='orbit'){ fill='var(--bg)'; stroke='var(--orbit)'; sw=2.2; }
  /* Hollow like orbit, thinner and cooler: the ring series reads inward by
     weight as well as by size. */
  else if(ring==='belt'){ fill='none'; stroke='var(--belt)'; sw=1.5; }
  else if(ring==='family'){ fill='var(--fam)'; stroke='var(--fam)'; }
  else { fill = ring==='inner'?'var(--inner)':'var(--solid)'; stroke=fill; }
  if(isFam){ stroke='var(--fam)'; }

  var r = isSelf?18:(RING_R[ring]||8);
  /* FIRST CHILD, SO IT SITS UNDER THE DRAWING -- the visible shape keeps every
     style and the pad only ever collects pointers. Radius is hitR(r), the same
     number the solver uses for this node's body, which is why two of these can
     never overlap and a grab can never land on the wrong person. */
  g.appendChild(el('circle',{'class':'hit',r:hitR(r)}));
  if(isFam && !isSelf){
    shape = el('rect',{'class':'shape',x:-r,y:-r,width:2*r,height:2*r,rx:4,
      fill:fill,stroke:stroke,'stroke-width':sw,'stroke-dasharray':pend?'3 3':null});
  } else {
    shape = el('circle',{'class':'shape',r:r,fill:fill,stroke:stroke,'stroke-width':sw,
      'stroke-dasharray':pend?'3 3':null});
  }
  g.appendChild(shape);
  if(ring==='inner' && !isSelf)
    g.appendChild(el('circle',{'class':'shape',r:r+4.5,fill:'none',stroke:stroke,'stroke-width':1,opacity:.45}));
  if(isSelf)
    g.appendChild(el('circle',{'class':'shape',r:24,fill:'none',stroke:'var(--self)','stroke-width':1,opacity:.4}));

  var tx = el('text',{'class':'nlabel',y:r+15});
  tx.textContent = isSelf?'KYUWON':p.name;
  g.appendChild(tx);
  g._tx = tx; g._r = r;

  g.addEventListener('click',function(){
    if(suppressClick){ suppressClick=false; return; }   /* that was a drag */
    select(p.name); });
  g.addEventListener('keydown',function(ev){
    if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); select(p.name); } });
  g.addEventListener('mouseenter',function(){ hot(p.name); });
  g.addEventListener('mouseleave',function(){ hot(selected); });
  g.addEventListener('focus',function(){ hot(p.name); });
  g.addEventListener('blur',function(){ hot(selected); });
  gN.appendChild(g);
  nodes[p.name]={g:g,p:p};
});

/* ------------------------------------------------------------------- morph */
var mode='circles', cur={}, anchors=LC.anchors;
function target(){ return mode==='circles'?LC:LT; }
Object.keys(LC.pos).forEach(function(n){ cur[n]={x:LC.pos[n].x,y:LC.pos[n].y}; });
syncLabels(LC);

function paint(){
  var L=target();
  Object.keys(nodes).forEach(function(n){
    var c=cur[n]; if(!c) return;
    var g=nodes[n].g;
    g.setAttribute('transform','translate('+c.x.toFixed(1)+','+c.y.toFixed(1)+')');
    var up = L.pos[n] && L.pos[n].up;
    g._tx.setAttribute('y', up ? -(g._r+8) : (g._r+15));
  });
  edges.forEach(function(e){
    var a=cur[e.a], b=cur[e.b]; if(!a||!b) return;
    e.el.setAttribute('x1',a.x.toFixed(1)); e.el.setAttribute('y1',a.y.toFixed(1));
    e.el.setAttribute('x2',b.x.toFixed(1)); e.el.setAttribute('y2',b.y.toFixed(1));
  });
  /* labels are simulated bodies; paint just reads where they ended up. The
     HANDLE moves, and its text and hit pad ride along -- one position, like a
     node, instead of a text position plus a rect position to keep in step. */
  for(var li=0; li<LAB.length && li<handleEls.length; li++){
    handleEls[li].setAttribute('transform',
      'translate('+LAB[li].x.toFixed(1)+','+LAB[li].y.toFixed(1)+')');
  }
  ties.forEach(function(t){
    var a=cur[t.from]; if(!a) return;
    var tg = t.target && anchors[t.target];
    var bx,by;
    if(tg){ var dx=tg.x-a.x, dy=tg.y-a.y, L=Math.sqrt(dx*dx+dy*dy)||1;
      bx=a.x+dx/L*Math.min(L*0.55,120); by=a.y+dy/L*Math.min(L*0.55,120); }
    else { bx=a.x+34; by=a.y-30; }
    t.el.setAttribute('x1',a.x.toFixed(1)); t.el.setAttribute('y1',a.y.toFixed(1));
    t.el.setAttribute('x2',bx.toFixed(1)); t.el.setAttribute('y2',by.toFixed(1));
    t.cap.setAttribute('cx',bx.toFixed(1)); t.cap.setAttribute('cy',by.toFixed(1));
  });
}
paint();

/* ------------------------------------------------- the settle (sim + drag)
   TWO PROBLEMS, ONE MECHANISM. At 79 records the deterministic layouts put
   16 pairs of NAME LABELS on top of each other (0 at 37) -- 15 of them among
   the 43 pendants, who ride one ring. A bigger radius cannot fix that: 43
   labels need ~123px of arc each, i.e. r=842 inside a 1240x900 field, and
   growing the canvas shrinks every label to ~6px. GRID_MIN already says a
   ring cannot hold them.

   So the layouts stop being POSITIONS and become ANCHORS. A spring pulls
   each node to its anchor, a label-aware collision pushes overlapping names
   apart, and the balance between them is a layout that keeps the
   deterministic structure AND is readable. Equilibrium, not a constant --
   which is the standing lesson of every layout fix in this file.

   It also answers the morph for free. Switching CIRCLES <-> CITIES now moves
   the anchors and the same nodes FLOW there, so correspondence -- the thing
   the morph exists to show -- is preserved by construction rather than by a
   760ms tween that had to be kept in sync. And it makes the graph draggable:
   drag a person, or drag a circle's label to move the whole circle, and the
   neighbours yield and settle. Release returns them to the flow. */

var SELFNAME = SELF ? SELF.name : null;
/* THE BOX HAS TO BE WHERE THE TEXT IS. The first three attempts separated a
   box CENTRED ON THE NODE while the name is drawn 15px BELOW it -- so the box
   covered the disc and missed most of the label, and two nodes could sit
   "clear" with their names squarely on top of each other. Measuring proved it
   and inverted the guess: the estimated boxes were ~2x too WIDE (Rachel Jeong
   39.6 vs a real 19.9) and far too short. Over-separating sideways, not
   separating at all where it mattered.
   So stop estimating. getBBox on the label returns its box IN THE NODE'S OWN
   LOCAL SPACE, which is exactly the offset and size wanted -- the same call
   that is wrong for screen-space overlap (v37) is right for a local offset. */
var FOOT = {};
function measureFeet(){
  PEOPLE.forEach(function(p){
    var nd = nodes[p.name]; if(!nd) return;
    var r = p.relation==='self' ? 18 : (RING_R[p.closeness] || 8);
    var f = { r:r, hr:hitR(r), dxD:0, dyD:r+15, hwD:8, hhD:6, dxU:0, dyU:-(r+8), hwU:8, hhU:6 };
    try{
      var was = nd.g._tx.getAttribute('y');
      nd.g._tx.setAttribute('y', r+15);
      var b = nd.g._tx.getBBox();
      /* +3/+2 of air, not +2/+1: at the tighter padding two pairs settled
         GRAZING -- 0.04px and 2.5px of real overlap. A box that resolves to
         exactly touching reads as touching. */
      f.dxD = b.x+b.width/2; f.dyD = b.y+b.height/2; f.hwD = b.width/2+5; f.hhD = b.height/2+3;
      nd.g._tx.setAttribute('y', -(r+8));
      b = nd.g._tx.getBBox();
      f.dxU = b.x+b.width/2; f.dyU = b.y+b.height/2; f.hwU = b.width/2+5; f.hhU = b.height/2+3;
      nd.g._tx.setAttribute('y', was);
    }catch(e){}
    FOOT[p.name] = f;
  });
}
var ORDER = PEOPLE.map(function(p){ return p.name; })
                  .filter(function(n){ return cur[n] && n!==SELFNAME; });

Object.keys(cur).forEach(function(n){ cur[n].vx=0; cur[n].vy=0; });

var SIM = { raf:null, alpha:0, drag:null, pinned:{}, transport:0 };
var K_ANCHOR = 0.030, K_LABEL = 0.055, DAMP = 0.84, SEP_ITERS = 8, MAXV = 26;
var EASE = 0.16;    /* transport rate -- see TRANSPORT in tick() */

/* ===================== SPIKE: FLUID / OBSIDIAN-FEEL PHYSICS =====================
   THROWAWAY. The shipped index.html springs every node to its own fixed anchor
   and never reads `edges` in tick() at all, so dragging one person moves nobody
   else -- neighbours only shift if the dragged disc physically collides with
   them, then snap back to their posts. That is the rigidity.

   Here edges are a FORCE. CIRCLES runs anchorless: link springs + global
   repulsion + a weak pull to centre, which is the Obsidian recipe. The circles
   still read because the edges are DERIVED from circle membership, so members
   attract each other -- the clustering is emergent instead of placed.

   CITIES keeps its anchors. A city is not a relation; no edge encodes it, so
   springs have nothing to pull on and a force layout cannot express "Austin".
*/
var K_LINK = 0.0022,    /* link spring toward LINK_LEN */
    LINK_LEN = 78,
    CHARGE = 2600,      /* node-node repulsion, falls off with distance^2 */
    CHARGE_MAX = 2.2,   /* cap one pair's repulsion so close pairs can't explode */
    K_CENTER = 0.0016,  /* weak gravity; replaces the anchor as the thing that
                           stops an anchorless graph drifting off the canvas */
    FREE_DAMP = 0.90;   /* floatier than DAMP(0.84): the glide is most of the feel */
function freeMode(){ return mode === 'circles'; }

/* hitR / HIT_PAD / HIT_MIN / CHIT_X / CHIT_Y are declared up beside RING_R --
   see the note there on why that position is load-bearing. The disc body in
   bodies() reads f.hr, which measureFeet sets from hitR. */

/* CLUSTER LABELS ARE BODIES TOO. The first pass had them ride their members
   exactly, and they promptly sat on nodes (IROH FAM on Shoham Sanyal) and on
   each other in CITIES, where 12 metros average two people. A label is the
   widest thing on the canvas and the only one that was not in the collision
   system -- so it goes in, with a spring to where its members are and the
   same separation everything else obeys. One system, not two. */
var LAB = [];
function labelTarget(l){
  var m=(l.solo && l.solo.length?l.solo:l.mem)
          .map(function(p){ return cur[p.name]; }).filter(Boolean);
  if(!m.length) return null;
  var sx=0, edge=l.below?-1e9:1e9;
  m.forEach(function(q){ sx+=q.x;
    if(l.below){ if(q.y>edge) edge=q.y; } else if(q.y<edge) edge=q.y; });
  return { x: Math.max(90, Math.min(W-90, sx/m.length)),
           y: l.below ? Math.min(H-14, edge+40) : Math.max(22, edge-38) };
}

function kick(a){
  SIM.alpha = Math.max(SIM.alpha, a==null?1:a);
  SIM.frames = 0;
  if(!SIM.raf) SIM.raf = requestAnimationFrame(tick);
}

/* one body list. Each entry carries an OFFSET from the thing it moves, so a
   name label can be separated while the node it belongs to is what actually
   travels. People contribute two bodies: the disc, and the label below it. */
function bodies(){
  var B=[], L=target(), i;
  /* KYUWON IS PINNED AT THE CENTRE AND WAS THEREFORE IN NO BODY LIST AT ALL --
     so nothing could be pushed off his label, and "KYUWON" sat under Amy Kim.
     Pinned is not absent: he joins as a FIXED body, which others yield to. */
  var list = SELFNAME ? [SELFNAME].concat(ORDER) : ORDER;
  for(i=0;i<list.length;i++){
    var n=list[i], f=FOOT[n], fx=(n===SELFNAME)||!!SIM.pinned[n], c=cur[n];
    if(!f || !c) continue;
    /* f.hr, not f.r+2: the body IS the grab disc (see hitR) */
    B.push({ p:c, ox:0, oy:0, hw:f.hr, hh:f.hr, fixed:fx });
    var up = L.pos[n] && L.pos[n].up;
    B.push({ p:c, ox: up?f.dxU:f.dxD, oy: up?f.dyU:f.dyD,
             hw: up?f.hwU:f.hwD, hh: up?f.hhU:f.hhD, fixed:fx });
  }
  for(i=0;i<LAB.length;i++)
    B.push({ p:LAB[i], ox:LAB[i].ox||0, oy:LAB[i].oy||0,
             hw:LAB[i].hw, hh:LAB[i].hh, fixed:false });
  return B;
}
function separate(B){
  var hits=0;
  for(var it=0; it<SEP_ITERS; it++){
    hits=0;
    for(var i=0;i<B.length;i++){
      var a=B[i], A=a.p;
      for(var j=i+1;j<B.length;j++){
        var b=B[j], Bp=b.p;
        if(A===Bp) continue;                          /* same person's own parts */
        var dx=(Bp.x+b.ox)-(A.x+a.ox), dy=(Bp.y+b.oy)-(A.y+a.oy);
        var ox=(a.hw+b.hw)-Math.abs(dx), oy=(a.hh+b.hh)-Math.abs(dy);
        if(ox<=0 || oy<=0) continue;                  /* boxes clear */
        if(a.fixed && b.fixed) continue;
        var pa = a.fixed?0:(b.fixed?1:.5), pb = b.fixed?0:(a.fixed?1:.5);
        hits++;
        if(ox < oy){                                  /* least-penetration axis */
          var s=(dx<0?-1:1)*ox;
          A.x-=s*pa; Bp.x+=s*pb;
        } else {
          var t=(dy<0?-1:1)*oy;
          A.y-=t*pa; Bp.y+=t*pb;
        }
      }
    }
    clampAll(B);
    if(!hits) break;
  }
  clampAll(B);
  return hits;
}
/* KEEP EVERYONE ON THE CANVAS. Separation resolves on the least-penetration
   axis, which in a vertically stacked pile keeps choosing "down" -- and once
   alpha decays the anchor spring is gone, so nothing ever pulled them back:
   content settled at -180..1215 in a 900-tall field and six people were
   clipped off the page, while only 828 of the 1240 width was in use. Bounding
   the world inside the solver forces it to spend the room it already has
   instead of escaping upward and downward. */
function clampAll(B){
  var M = 10;
  for(var i=0;i<B.length;i++){
    var b=B[i], p=b.p;
    if(b.fixed) continue;
    var lo = M + b.hw - b.ox, hi = W - M - b.hw - b.ox;
    p.x = hi<lo ? (lo+hi)/2 : Math.max(lo, Math.min(hi, p.x));
    lo = M + b.hh - b.oy; hi = H - M - b.hh - b.oy;
    p.y = hi<lo ? (lo+hi)/2 : Math.max(lo, Math.min(hi, p.y));
  }
}

/* WHY alpha SCALES THE SPRING AND NOT JUST THE LOOP. First two attempts had a
   constant anchor spring: it pulled overlapping nodes back together exactly as
   fast as separation pushed them apart, so the sim reached an equilibrium that
   still overlapped, and the count depended on the path taken (9 -> 12 -> 20
   across two mode switches). The spring has to DECAY. Early frames are the
   structure pass -- nodes fly to their circle; late frames are pure
   de-overlap, with nothing pulling back. Separation is then a constraint
   rather than a rival force, and once resolved it stays resolved because
   nothing disturbs it. That is the whole reason a force layout converges, and
   leaving it out is why tuning the constants could not have worked. */
/* ...AND IF ANYTHING STILL ENDS UP OUTSIDE -- a hard drag, or a body the
   clamp had to centre because it is wider than the canvas -- the view opens
   up to include it rather than cropping a person out of his own map. Never
   shrinks below the base frame, so the ordinary layout does not drift in
   scale; eased, so it never snaps. "I want to make sure I can see everyone." */
var VB={x:0,y:0,w:W,h:H};
/* SPIKE: once the user has zoomed or panned, the auto-fit is no longer helping
   -- it is fighting them for control of the viewBox. VIEW_LOCK hands the view
   over for good (until Reset). Without this, every frame drags the camera back
   and a scroll-zoom looks broken rather than ignored. */
var VIEW_LOCK = 0;
function fitView(B){
  if(VIEW_LOCK) return;
  var M=14, x1=0, y1=0, x2=W, y2=H;
  for(var i=0;i<B.length;i++){
    var b=B[i], px=b.p.x+b.ox, py=b.p.y+b.oy;
    if(px-b.hw-M < x1) x1=px-b.hw-M;
    if(py-b.hh-M < y1) y1=py-b.hh-M;
    if(px+b.hw+M > x2) x2=px+b.hw+M;
    if(py+b.hh+M > y2) y2=py+b.hh+M;
  }
  var k=0.14;
  VB.x+=(x1-VB.x)*k; VB.y+=(y1-VB.y)*k;
  VB.w+=((x2-x1)-VB.w)*k; VB.h+=((y2-y1)-VB.h)*k;
  svg.setAttribute('viewBox', VB.x.toFixed(1)+' '+VB.y.toFixed(1)+' '+
                              VB.w.toFixed(1)+' '+VB.h.toFixed(1));
}

/* TRANSPORT, AND IT IS NOT A SIMULATION. A layout change used to be run as
   physics: spring everyone toward their new seat while the de-overlap
   constraint keeps resolving contacts on the way. MEASURED on one Austin node
   mid-flight: velocity steady at (-2.01, -8.79), pointing straight at its
   cell, and the position moved 0.000002px that frame. The anchor pulled for
   1000+ frames and separate() cancelled every pixel of it.
   WHY, AND IT IS STRUCTURAL: 31 people converging on a 4x8 grid arrive as a
   crowd. separate() resolves each contact on its least-penetration axis and
   splits the push evenly, so a crowd of hard bodies all travelling the same
   way locks into a lattice -- the ones in front block the ones behind and the
   ones behind push the ones in front back out. The pile stopped 110px from
   home (median; 584px worst) with the target grid measuring 0 conflicts. The
   old rosette hid this because its targets were loose blobs: being 110px off
   inside a 450-radius ring still looks like a ring. A grid shows every pixel.
   SO COLLISIONS DO NOT RUN WHILE PEOPLE ARE TRAVELLING. A morph eases everyone
   to their seat and lets them pass through each other on the way -- it is an
   animation, not a physical claim -- and the settle phase afterwards starts its
   first frame AT the layout instead of 400px short of it, which is the initial
   condition the decaying spring above always assumed it had. */
function tick(){
  var L=target(), moving=0, i, n, c, t, A=SIM.alpha;
  if(SIM.transport){
    var far=0;
    for(i=0;i<ORDER.length;i++){
      n=ORDER[i]; c=cur[n]; t=L.pos[n];
      if(SIM.pinned[n] || !t) continue;
      c.x+=(t.x-c.x)*EASE; c.y+=(t.y-c.y)*EASE; c.vx=0; c.vy=0;
      if(Math.abs(t.x-c.x)+Math.abs(t.y-c.y) > 0.6) far++;
    }
    /* labels ride to the position the LAYOUT gave them, not to a centroid of
       members that are themselves still moving -- chasing a moving average is
       how a label ends up 275px from its own block. */
    for(i=0;i<LAB.length;i++){
      var lb=LAB[i];
      lb.x+=(lb.l.x-lb.x)*EASE; lb.y+=(lb.l.y-lb.y)*EASE; lb.vx=0; lb.vy=0;
      if(Math.abs(lb.l.x-lb.x)+Math.abs(lb.l.y-lb.y) > 0.6) far++;
    }
    if(SELFNAME && cur[SELFNAME]){
      var ts=L.pos[SELFNAME] || {x:CX,y:CY}, cs=cur[SELFNAME];
      cs.x+=(ts.x-cs.x)*EASE; cs.y+=(ts.y-cs.y)*EASE;
    }
    SIM.frames = (SIM.frames||0)+1;
    if(!far || SIM.frames > 240){ SIM.transport=0; SIM.alpha=1; SIM.frames=0; }
    fitView(bodies()); paint();
    SIM.raf = requestAnimationFrame(tick);
    return;
  }
  var FREE = freeMode();
  if(FREE){
    /* --- repulsion, every pair. 82 nodes is 3.3k pairs; trivial per frame. --- */
    for(i=0;i<ORDER.length;i++){
      var ca = cur[ORDER[i]]; if(!ca) continue;
      for(var j=i+1;j<ORDER.length;j++){
        var cb = cur[ORDER[j]]; if(!cb) continue;
        var rx = cb.x-ca.x, ry = cb.y-ca.y, d2 = rx*rx+ry*ry;
        if(d2 < 1) { rx = (Math.random()-0.5); ry = (Math.random()-0.5); d2 = 1; }
        var fr = CHARGE/d2; if(fr > CHARGE_MAX) fr = CHARGE_MAX;
        var dd = Math.sqrt(d2), ux = rx/dd, uy = ry/dd;
        ca.vx -= ux*fr; ca.vy -= uy*fr;
        cb.vx += ux*fr; cb.vy += uy*fr;
      }
    }
    /* --- link springs. THIS is the give: a dragged node is still pinned, so it
       does not move, but it keeps pulling on everything tied to it, and that
       pull attenuates outward through the graph exactly like Obsidian. --- */
    for(i=0;i<edges.length;i++){
      var e=edges[i], pa=cur[e.a], pb=cur[e.b];
      if(!pa || !pb) continue;
      var ex=pb.x-pa.x, ey=pb.y-pa.y, ed=Math.sqrt(ex*ex+ey*ey) || 0.001;
      var f = (ed - LINK_LEN) * K_LINK;
      var ax=(ex/ed)*f, ay=(ey/ed)*f;
      pa.vx += ax; pa.vy += ay;
      pb.vx -= ax; pb.vy -= ay;
    }
    /* --- integrate. A pinned node accumulates force and discards it: it stays
       under the cursor, which is what makes the drag feel solid while the web
       around it stays live. --- */
    for(i=0;i<ORDER.length;i++){
      n=ORDER[i]; c=cur[n];
      if(!c) continue;
      if(SIM.pinned[n]){ c.vx=0; c.vy=0; continue; }
      c.vx = (c.vx + (CX-c.x)*K_CENTER) * FREE_DAMP;
      c.vy = (c.vy + (CY-c.y)*K_CENTER) * FREE_DAMP;
      var sp2 = Math.abs(c.vx)+Math.abs(c.vy);
      if(sp2 > MAXV){ var k2=MAXV/sp2; c.vx*=k2; c.vy*=k2; }
      c.x += c.vx; c.y += c.vy;
      if(sp2 > 0.06) moving++;
    }
  } else {
    for(i=0;i<ORDER.length;i++){
      n=ORDER[i]; c=cur[n]; t=L.pos[n];
      if(SIM.pinned[n] || !t) continue;
      c.vx = (c.vx + (t.x-c.x)*K_ANCHOR*A) * DAMP;
      c.vy = (c.vy + (t.y-c.y)*K_ANCHOR*A) * DAMP;
      var sp = Math.abs(c.vx)+Math.abs(c.vy);
      if(sp > MAXV){ var k=MAXV/sp; c.vx*=k; c.vy*=k; }
      c.x += c.vx; c.y += c.vy;
      if(sp > 0.06) moving++;
    }
  }
  for(i=0;i<LAB.length;i++){
    var la=LAB[i], lt=labelTarget(la.l);
    if(!lt) continue;
    /* In free mode the nodes never stop moving, so a label spring scaled by a
       decaying alpha would stop tracking its own cluster and be left behind.
       Floor it. */
    var LA = freeMode() ? Math.max(A, 0.45) : A;
    la.vx=(la.vx+(lt.x-la.x)*K_LABEL*LA)*DAMP;
    la.vy=(la.vy+(lt.y-la.y)*K_LABEL*LA)*DAMP;
    la.x+=la.vx; la.y+=la.vy;
    if(Math.abs(la.vx)+Math.abs(la.vy) > 0.06) moving++;
  }
  var B = bodies();
  var left = separate(B);
  /* HE IS PINNED TO HIS SEAT, NOT TO THE CENTRE OF THE CANVAS. This was a
     hard assignment to (CX,CY) every frame, which was the same thing while
     both layouts put him there. CITIES now seats him inside Austin, so the
     pin follows the layout instead of the geometry -- eased, so the toggle
     carries him across rather than teleporting him. He stays a FIXED body in
     separate(), so he is still the thing everyone else yields to. In CIRCLES
     his target IS (CX,CY) and nothing about this moves him. */
  if(SELFNAME && cur[SELFNAME]){
    var st=L.pos[SELFNAME] || {x:CX,y:CY}, sc=cur[SELFNAME];
    sc.x += (st.x-sc.x)*0.12; sc.y += (st.y-sc.y)*0.12;
    if(Math.abs(st.x-sc.x)+Math.abs(st.y-sc.y) > 0.4) moving++;
  }
  fitView(B);
  paint();
  /* Free mode keeps a floor of warmth so the graph always has a little life in
     it and a drag never has to "wake" anything -- the settle still happens,
     because damping and the force balance do it, not a decaying coefficient. */
  SIM.alpha *= freeMode() ? 0.985 : 0.955;
  if(freeMode() && SIM.alpha < 0.22) SIM.alpha = 0.22;
  if(SIM.alpha < 0.004) SIM.alpha = 0;
  SIM.frames = (SIM.frames||0)+1;
  /* keep going while anything still overlaps, with a budget so a genuinely
     unsatisfiable set (more labels than room) cannot spin forever */
  /* Free mode has a permanent alpha floor, so the old condition would spin
     forever at full tilt. Park the loop once nothing is actually moving and no
     pointer is down; any kick() or hover restarts it. */
  var busy = moving || SIM.drag || (left && SIM.frames < 900);
  if(freeMode() ? busy : (busy || SIM.alpha))
    SIM.raf = requestAnimationFrame(tick);
  else { SIM.raf=null; if(!freeMode()) SIM.alpha=0; }
}

/* ----------------------------------------------------------------- dragging */
/* getScreenCTM, not a width ratio: the viewBox now moves AND preserveAspectRatio
   letterboxes it, so a naive ratio drifts the grab point. The CTM knows both. */
function svgPt(ev){
  var m = svg.getScreenCTM && svg.getScreenCTM();
  if(m){
    var inv = m.inverse();
    return { x: ev.clientX*inv.a + ev.clientY*inv.c + inv.e,
             y: ev.clientX*inv.b + ev.clientY*inv.d + inv.f };
  }
  var b=svg.getBoundingClientRect(), vb=svg.viewBox.baseVal;
  return { x: vb.x+(ev.clientX-b.left)*vb.width/b.width,
           y: vb.y+(ev.clientY-b.top)*vb.height/b.height };
}
function startDrag(ev, names, onMove){
  if(ev.button!=null && ev.button!==0) return;
  var p0=svgPt(ev), moved=false;
  var base={}; names.forEach(function(n){ if(cur[n]) base[n]={x:cur[n].x,y:cur[n].y}; });
  SIM.drag = names;
  /* NO setPointerCapture. It throws NotFoundError whenever the pointer is not
     currently active -- a cancelled touch, a stale id -- and it sat BEFORE the
     listeners were attached, so the throw killed the whole drag silently. The
     move/up listeners live on window, which already survives leaving the
     element, so the capture bought nothing and could only fail. */
  function move(e){
    var p=svgPt(e), dx=p.x-p0.x, dy=p.y-p0.y;
    if(!moved && Math.abs(dx)+Math.abs(dy) < 4) return;   /* let a click stay a click */
    if(!moved){ moved=true; svg.classList.add('dragging'); names.forEach(function(n){ SIM.pinned[n]=1; }); }
    names.forEach(function(n){
      if(!base[n]) return;
      cur[n].x = base[n].x+dx; cur[n].y = base[n].y+dy; cur[n].vx=0; cur[n].vy=0;
    });
    if(onMove) onMove();
    kick(1);
  }
  function up(){
    window.removeEventListener('pointermove',move);
    window.removeEventListener('pointerup',up);
    window.removeEventListener('pointercancel',up);
    names.forEach(function(n){ delete SIM.pinned[n]; });
    SIM.drag=null; svg.classList.remove('dragging');
    if(moved) suppressClick=true;
    kick(1);                       /* released: physics carries them home */
  }
  window.addEventListener('pointermove',move);
  window.addEventListener('pointerup',up);
  window.addEventListener('pointercancel',up);
}
var suppressClick=false;

Object.keys(nodes).forEach(function(n){
  nodes[n].g.addEventListener('pointerdown',function(ev){ startDrag(ev,[n]); });
});

var anim=null;
function morph(){
  anchors = target().anchors;
  syncLabels(target());
  /* a layout change is transport; a drag release is not, and still relaxes
     through the spring the way it always did */
  SIM.transport = 1; SIM.frames = 0;
  kick(1);
}
function setMode(m){
  if(m===mode) return;
  mode=m;
  document.getElementById('bC').setAttribute('aria-pressed', m==='circles');
  document.getElementById('bT').setAttribute('aria-pressed', m==='cities');
  morph();
}
document.getElementById('bC').onclick=function(){ setMode('circles'); };
document.getElementById('bT').onclick=function(){ setMode('cities'); };
measureFeet();      /* needs the labels in the DOM; getBBox is 0 before that */
syncLabels(LC);     /* re-measure the cluster labels now the font has loaded */
kick(1);

/* ----------------------------------------------------------- hover + select */
var selected=null;

/* Clearing a pin used to need a second click on the SAME person, which means
   knowing who is pinned and hitting a disc to undo it. Anywhere is the escape
   hatch: empty canvas, empty panel, or Esc. */
function deselect(){
  if(selected===null) return;
  selected=null;
  hot(null);
  syncPanelSel();
  if(CHROME.card && card) card.innerHTML='';
}
function hot(n){
  var on=!!n;
  Object.keys(nodes).forEach(function(k){
    nodes[k].g.classList.toggle('dim', on && k!==n && !touching(n,k));
    nodes[k].g.classList.toggle('sel', k===selected);
  });
  edges.forEach(function(e){
    var mine = on && (e.a===n||e.b===n);
    e.el.classList.toggle('dim', on && !mine);
    e.el.classList.toggle('hot', mine);
  });
  ties.forEach(function(t){
    var mine = on && t.from===n;
    [t.el,t.cap].forEach(function(x){ x.classList.toggle('dim', on && !mine); });
  });
}
function touching(n,k){ return edges.some(function(e){
  return (e.a===n&&e.b===k)||(e.b===n&&e.a===k); }); }

/* Highlight a whole CIRCLE. Deliberately not hot()'s rule: a person lights up
   their neighbours, but a nine-person circle's neighbours are most of the map,
   and lighting most of the map is the same as lighting none of it. So members
   only, and only the edges with BOTH ends inside. */
function hotGroup(names){
  var has={}, on = !!(names && names.length);
  (names||[]).forEach(function(n){ has[n]=1; });
  Object.keys(nodes).forEach(function(k){
    nodes[k].g.classList.toggle('dim', on && !has[k]);
    nodes[k].g.classList.toggle('sel', k===selected);
  });
  edges.forEach(function(e){
    var mine = on && has[e.a] && has[e.b];
    e.el.classList.toggle('dim', on && !mine);
    e.el.classList.toggle('hot', mine);
  });
  ties.forEach(function(t){
    [t.el,t.cap].forEach(function(x){ x.classList.toggle('dim', on && !has[t.from]); });
  });
}

/* ======================= SPIKE: ZOOM + PAN =======================
   The shipped map has neither, and they are most of what "Obsidian feel" means
   beyond the physics. Both drive the same VB the auto-fit used, so there is one
   camera, not two.                                                           */
function applyVB(){
  svg.setAttribute('viewBox', VB.x.toFixed(1)+' '+VB.y.toFixed(1)+' '+
                              VB.w.toFixed(1)+' '+VB.h.toFixed(1));
}
/* Zoom about the CURSOR, not the centre: keeping the point under the pointer
   fixed is the whole difference between zoom that feels aimed and zoom that
   feels like it is shoving the map around. */
svg.addEventListener('wheel', function(ev){
  ev.preventDefault();
  VIEW_LOCK = 1;
  var r = svg.getBoundingClientRect();
  var fx = (ev.clientX - r.left) / r.width, fy = (ev.clientY - r.top) / r.height;
  var ax = VB.x + fx*VB.w, ay = VB.y + fy*VB.h;
  var f = Math.exp(ev.deltaY * 0.0012);
  var nw = Math.max(160, Math.min(W*6, VB.w*f));
  var nh = nw * (VB.h/VB.w);
  VB.x = ax - fx*nw; VB.y = ay - fy*nh; VB.w = nw; VB.h = nh;
  applyVB();
}, {passive:false});

/* Pan on background drag only. `ev.target===svg` is the test: a node's own
   pointerdown starts a node drag, and without this check the background would
   pan underneath it at the same time. */
svg.addEventListener('pointerdown', function(ev){
  if(ev.target !== svg || (ev.button!=null && ev.button!==0)) return;
  VIEW_LOCK = 1;
  var r = svg.getBoundingClientRect();
  var sx = ev.clientX, sy = ev.clientY, bx = VB.x, by = VB.y, panned = false;
  svg.classList.add('dragging');
  function mv(e){
    if(!panned && Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy) > 3) panned = true;
    VB.x = bx - (e.clientX-sx) * (VB.w/r.width);
    VB.y = by - (e.clientY-sy) * (VB.h/r.height);
    applyVB();
  }
  function up(){
    window.removeEventListener('pointermove',mv);
    window.removeEventListener('pointerup',up);
    window.removeEventListener('pointercancel',up);
    svg.classList.remove('dragging');
    /* A pan is not a click. Without this, every drag of the background that
       ended over empty canvas would also drop the pin. */
    if(panned) suppressClick = true;
  }
  window.addEventListener('pointermove',mv);
  window.addEventListener('pointerup',up);
  window.addEventListener('pointercancel',up);
});

/* Give the camera back. Also re-heats the sim, because in free mode a parked
   loop would otherwise leave the graph frozen at whatever the last frame was. */
function resetView(){ VIEW_LOCK = 0; kick(1); }
window.addEventListener('keydown', function(e){
  if(e.key==='r' || e.key==='R'){ resetView(); }
});

/* -------------------------------------------------------------------- dates */
function parseBday(b){
  if(!b) return null;
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(b) || /^(\d{2})-(\d{2})$/.exec(b);
  if(!m) return null;
  var mo,da,yr=null;
  if(m.length===4){ yr=+m[1]; mo=+m[2]; da=+m[3]; } else { mo=+m[1]; da=+m[2]; }
  var next = new Date(TODAY.getFullYear(), mo-1, da);
  if(next < TODAY) next = new Date(TODAY.getFullYear()+1, mo-1, da);
  return {mo:mo, da:da, yr:yr, days: Math.round((next-TODAY)/864e5)};
}
function daysSince(iso){
  var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso||''));
  if(!m) return null;
  return Math.round((TODAY - new Date(+m[1],+m[2]-1,+m[3]))/864e5);
}
var BUCKET={week:7,month:30,months:90};
/* cadence is free prose. These are the phrasings actually present; anything
   else is reported as unscorable rather than guessed at. */
var CAD=[[/few times a week/i,3],[/once every 2 months|every 2 months/i,60],
         [/every 1-?2 weeks/i,10],[/every 2 weeks|biweek/i,14],
         [/once a week|~ ?a week|a week/i,7],[/once a month|monthly|a month/i,30]];
function cadenceDays(s){
  if(!s) return null;
  var best=null;
  CAD.forEach(function(c){ if(c[0].test(s)) best = best==null?c[1]:Math.min(best,c[1]); });
  return best;
}

/* --------------------------------------------------------------------- rail */
var rail=slot('rail');
function buildRail(){
  if(!CHROME.rail || !rail) return;   /* no container: the scoring code stays, unrendered */
  var items=[], cant=[];
  PEOPLE.forEach(function(p){
    if(p.relation==='self') return;
    var ot=p.open_thread;
    if(ot && ot.status==='open'){
      var since=String(ot.since||'').slice(0,10), ds=daysSince(since);
      items.push({p:p,pri:0,sort:(ds==null?0:-ds),badge:'thread',
        lab:'open thread', when: ds!=null?(ds===0?'today':ds+'d open'):(ot.since||''),
        line: String(ot.what).split(/(?<=\.)\s/)[0].slice(0,190)});
    }
  });
  PEOPLE.forEach(function(p){
    if(p.relation==='self') return;
    var b=parseBday(p.birthday);
    if(b && b.days<=30)
      items.push({p:p,pri:1,sort:b.days,badge:b.days===0?'today':'bday',
        lab:b.days===0?'birthday today':'birthday',
        when: b.days===0?'TODAY':'in '+b.days+'d',
        line: 'Birthday '+String(b.mo).padStart(2,'0')+'-'+String(b.da).padStart(2,'0')+'.'});
  });
  PEOPLE.forEach(function(p){
    if(p.relation==='self') return;
    if(p.closeness==='family' || p.closeness==='belt') return;
    /* family is its own thing; belt is OFF the cadence scale by construction --
       a cadence score says "you should have talked by now", and the belt is
       exactly the set with no such expectation. Including them would have put
       37 pendants into the no-score complaint and buried the real misses. */
    /* v38 added `cadence_days` as "the integer the rail reads" because scoring
       deviation by KEYWORD-MATCHING A SENTENCE runs on string luck -- and the
       rail then never read it. It stayed invisible because the only three
       records carrying both AGREED (3/10/7), so the prose matcher kept
       producing the right answer from a field nobody consumed. One record
       is the first disagreement: a numeric cadence beside a prose cadence
       that matches no pattern, so it read as "no cadence recorded".
       A FIELD WITH NO CONSUMER IS A COMMENT, exactly as v18 said a rule with
       no field is. The integer wins; the prose is the fallback; and when both
       exist and disagree the integrity panel SAYS SO rather than picking one
       quietly (the v48 ruling on denormalised values). */
    var cdProse = cadenceDays(p.cadence);
    var cd = (typeof p.cadence_days === 'number' && p.cadence_days > 0) ? p.cadence_days : cdProse;
    if(typeof p.cadence_days === 'number' && cdProse != null && cdProse !== p.cadence_days)
      problems.push({t:'cadence_days disagrees with the cadence prose',
        d:esc(p.name)+' &mdash; field says <code>'+p.cadence_days+'d</code>, the sentence parses as <code>'
          +cdProse+'d</code>. The field is being used.'});
    var lt=p.last_talked;
    if(!cd || !lt){
      if(p.closeness) cant.push({p:p,why: !cd?'no cadence recorded':'no last_talked'});
      return;
    }
    /* v30 made `metro` THE GATE, and v66 found it INVERTED IN BOTH DIRECTIONS
       on two records captured in the same message. One record is same-metro, so
       the gate refused to score it, although its channel is TEXT -- the one
       thing the data CAN see. Another is long-distance, which the gate calls
       readable, and its cadence is IN PERSON, which neither dataset sees.
       metro was always a PROXY for channel, and `channel` has existed since
       v13 for exactly this. Read the field when the record has one; fall back
       to metro only when it does not. `group_setting` is deliberately NOT
       remote: a group-conducted friendship must never be scored against a
       dyadic baseline (v16, Nam Thai). Kyuwon's own metro decides what "same
       metro" means -- this was the literal string 'Austin'.              */
    var ch = p.channel || [];
    var remote = ch.length
      ? ch.some(function(c){ return c==='text'||c==='voice'||c==='online_shared_activity'; })
      : p.metro !== SELF.metro;
    if(!remote){
      cant.push({p:p, why: ch.length
        ? 'channel is '+ch.join(' + ')+' — neither dataset can see it'
        : (p.metro||'metro unknown')+' — same metro as him, in-person channel, no remote signal'});
      return;
    }
    var since=daysSince(lt), approx=false;
    if(since==null){ var b=BUCKET[String(lt).toLowerCase()];
      if(b==null){ cant.push({p:p,why:'last_talked not a date or known bucket'}); return; }
      since=b; approx=true; }
    var ratio=since/cd;
    if(ratio<1.4){ cant.push({p:p,why:'within cadence ('+since+'d vs ~'+cd+'d'+(approx?', approx':'')+')'}); return; }
    items.push({p:p,pri:2,sort:-ratio,badge:'cad',lab:'cadence drift',
      when: ratio.toFixed(1)+'×',
      line:'Last talked '+since+'d ago'+(approx?' (bucket, approximate)':'')+
           ' against a ~'+cd+'d cadence. '+(p.metro||'')+' — long-distance, so the text channel is the real one.'});
  });

  items.sort(function(a,b){ return a.pri-b.pri || a.sort-b.sort || a.p.name.localeCompare(b.p.name); });

  var h='<h2>Check-in rail &middot; '+items.length+'</h2>';
  if(!items.length) h+='<div class="empty">Nothing needs attention today.</div>';
  items.forEach(function(it){
    var r=it.p.closeness||'none';
    h+='<button class="ri" data-n="'+esc(it.p.name)+'">'
      +'<span class="r1"><span class="nm">'+esc(it.p.name)+'</span>'
      +'<span class="ring '+r+'">'+(it.p.closeness||'no ring')+'</span>'
      +'<span class="when">'+esc(it.when)+'</span></span>'
      +'<span class="r2"><span class="badge b-'+it.badge+'">'+esc(it.lab)+'</span> '+esc(it.line)+'</span>'
      +'</button>';
  });
  var noRing=PEOPLE.filter(function(p){return p.relation==='friend'&&!p.closeness;}).length;
  var ringedN=PEOPLE.filter(function(p){return p.closeness && p.closeness!=='family'
                                        && p.closeness!=='belt';}).length;
  /* Both sentences below are guarded on an EMPTY list. A count of 0 followed by a
     colon and nothing after it reads as a broken page, not as good news -- and the
     integrity panel's twin of this sentence was guarded at v53 while this one was
     left, which is this project's own recurring defect: a fix scoped to the single
     instance in front of me. Fixed here as a pair, deliberately. */
  h+='<div class="cant"><b>What this rail cannot score, stated rather than hidden.</b><br>'
    + (cant.length
        ? cant.length+' of '+ringedN+' ringed people have no cadence score: '
          + cant.map(function(c){return esc(c.p.name)+' ('+c.why+')';}).join(' &middot; ')+'.'
        : '<b>Every ringed person has a cadence score.</b>')
    + '<br>'+(noRing
        ? noRing+(noRing===1?' friend has':' friends have')+' no ring yet, so '
          +(noRing===1?'they are':'they are')+' absent from the rail entirely.'
        : '<b>Every friend has a ring, so nobody is missing from this rail.</b>')
    + '<br><b>Birthdays only surface inside 30 days</b>, and this axis may be redundant '
    + '&mdash; he already schedules these himself.</div>';
  rail.innerHTML=h;
  Array.prototype.forEach.call(rail.querySelectorAll('.ri'),function(b){
    b.onclick=function(){ select(b.getAttribute('data-n')); };
  });
}

/* --------------------------------------------------------------------- card */
var card=slot('card');
var NULLMEAN={named:'a roster name',none_met_directly:'asked &mdash; met directly, there is no introducer',
  exists_unnamed_withheld:'asked &mdash; an introducer exists, and the name is withheld by his choice',
  not_asked:'not asked'};
function row(k,v,cls){ return v==null||v===''||(Array.isArray(v)&&!v.length)?'':
  '<dt>'+k+'</dt><dd'+(cls?' class="'+cls+'"':'')+'>'+v+'</dd>'; }
function select(n){
  selected = (selected===n)?null:n;
  hot(selected);          /* highlight still works with no card */
  syncPanelSel();
  if(!CHROME.card || !card) return;
  if(!selected){ card.innerHTML=''; return; }
  var p=byName[n]; if(!p) return;
  var r=p.closeness||'none';
  var h='<div class="hd"><h2>'+esc(p.name)+'</h2>'
    +'<span class="ring '+r+'">'+(p.closeness||'ring not asked')+'</span>';
  if(p.relation!=='friend' && p.relation!==p.closeness) h+='<span class="pill">'+esc(p.relation)+'</span>';
  if(p.capture_status!=='captured') h+='<span class="pill nom">'+esc(p.capture_status||'?')+'</span>';
  h+='<button class="x" id="cx">close</button></div>';

  var ot=p.open_thread;
  if(ot){
    h+='<div class="sect"><div class="thread"><div class="t1">open thread'
      +(ot.status==='open'?'':' &mdash; '+esc(ot.status))
      +(ot.since?' &middot; since '+esc(ot.since):'')+'</div>'+esc(ot.what)
      +(ot.needs_followup?'<div class="prov">Needs follow-up.</div>':'')+'</div></div>';
  }

  h+='<div class="sect"><h3>His judgment</h3><dl class="kv">';
  h+=row('closeness', p.closeness? esc(p.closeness)+(p.closeness_note?'<div class="prov">'+esc(p.closeness_note)+'</div>':'') : '<span style="color:var(--ink3)">not asked</span>');
  h+=row('circle', (p.circle||[]).map(function(c){return '<span class="pill">'+esc(c)+'</span>';}).join(''));
  h+=row('nominal circle', (p.circle_nominal||[]).map(function(c){
      return '<span class="pill nom">'+esc(c)+' &mdash; affiliation only</span>';}).join(''));
  h+=row('cadence', p.cadence?esc(p.cadence):null,'prose');
  h+=row('channel', (p.channel||[]).map(function(c){return '<span class="pill">'+esc(c)+'</span>';}).join(''));
  h+='</dl></div>';

  h+='<div class="sect"><h3>Facts</h3><dl class="kv">';
  h+=row('metro', p.metro?esc(p.metro):null);
  h+=row('city', (p.city&&p.city!==p.metro)?esc(p.city):null);
  h+=row('live now', p.live_now?esc(p.live_now)+(p.live_now_asof?'<div class="prov">as of '+esc(p.live_now_asof)+'</div>':''):null,'prose');
  h+=row('birthday', p.birthday?esc(p.birthday)+(function(){var b=parseBday(p.birthday);
      return b?' <span style="color:var(--ink3)">('+(b.days===0?'today':'in '+b.days+' days')+')</span>':'';})():null);
  h+=row('met where', p.met_where?esc(p.met_where)+(p.met_where_affiliating?' <span class="pill">member</span>':''):null);
  h+=row('met when', p.met_when?esc(p.met_when):null);
  h+=row('met online', p.met_online?esc(p.met_online):null);
  h+=row('co-attended', (p.co_attended||[]).map(function(c){return '<span class="pill">'+esc(c)+'</span>';}).join(''));
  h+=row('last talked', p.last_talked?esc(p.last_talked)+(p.last_talked_how?' &middot; '+esc(p.last_talked_how):''):null);
  h+=row('partner of', p.partner_of?esc(p.partner_of):null);
  h+='</dl></div>';

  h+='<div class="sect"><h3>Origin of the friendship</h3><dl class="kv">';
  h+=row('introduced by', p.introduced_by?esc(p.introduced_by):
      '<span style="color:var(--ink3)">none recorded</span>');
  /* introduced_by_status exists (v37) to say WHICH OF FOUR THINGS AN EMPTY FIELD MEANS.
     So it is only shown when the field IS empty. Printing "null means: a roster name"
     under a named introducer -- which this did for every populated record -- is a
     caption answering a question the record does not raise. */
  if(!p.introduced_by)
    h+=row('what the blank means', '<span style="color:var(--ink2)">'
      +(NULLMEAN[p.introduced_by_status]||'status not set')+'</span>');
  h+=row('context', p.introduced_context?esc(p.introduced_context):null,'prose');
  h+=row('closer since', p.closer_since?esc(p.closer_since):null,'prose');
  h+='</dl></div>';

  if((p.highlights||[]).length){
    h+='<div class="sect"><h3>Highlights &mdash; his, never inferred</h3><dl class="kv">';
    (p.highlights||[]).forEach(function(hl){
      h+=row(esc(hl.date||hl.when||'&mdash;'), esc(hl.what)
        + ((hl['with']||[]).length?'<div class="prov">with '+hl['with'].map(esc).join(', ')+'</div>':''),'prose');
    });
    h+='</dl></div>';
  }

  var myE = edges.filter(function(e){ return e.a===p.name||e.b===p.name; });
  var myT = ties.filter(function(t){ return t.from===p.name; });
  h+='<div class="sect"><h3>Edges &mdash; derived, '+myE.length+'</h3><dl class="kv">';
  if(myE.filter(function(e){return e.kind!=='kyuwon'&&e.kind!=='family';}).length===0)
    h+=row('&mdash;','<b>No edges but Kyuwon.</b> No circle, no introducer, no shared highlight &mdash; and still '
      +(p.relation==='family' ? 'family. That is what the centre node is for.'
                              : 'a real friend. That is what the centre node is for.'),'prose');
  ['highlight','intro','partner','circle','manual','family','kyuwon'].forEach(function(k){
    var es=myE.filter(function(e){return e.kind===k;});
    if(!es.length) return;
    h+=row(k==='intro'?'introduced':k, es.map(function(e){
      var other = e.a===p.name?e.b:e.a;
      if(e.kind==='intro')
        return '<span style="color:var(--ink3)">Kyuwon met '
               +(e.a===p.name?esc(other)+' through '+esc(p.name):esc(p.name)+' through '+esc(other))
               +'</span>';
      return esc(other)+'<span style="color:var(--ink3)"> &middot; '+esc(e.why.join('; '))+'</span>';
    }).join('<br>'),'prose');
  });
  myT.forEach(function(t){ h+=row(t.kind==='stub'?'withheld':'nominal tie','<span style="color:var(--ink2)">'+t.why+'</span>','prose'); });
  h+='</dl></div>';

  if(p.read||p.tell){
    h+='<div class="sect"><h3>From the IG export &mdash; provisional, not his words</h3><dl class="kv">';
    h+=row('read', p.read?esc(p.read):null,'prose');
    h+=row('tell', p.tell?esc(p.tell):null,'prose');
    h+='</dl><div class="prov">Derived from the DM export. The export has been wrong about closeness '
      +'repeatedly; these are reading notes, not judgments.</div></div>';
  }
  if(p.notes){
    h+='<div class="sect"><h3>Capture notes</h3><dl class="kv">'
      +row('notes',esc(p.notes),'prose')+'</dl></div>';
  }
  card.innerHTML=h;
  document.getElementById('cx').onclick=function(){ select(n); };
  card.scrollIntoView({behavior:'smooth',block:'nearest'});
}

/* ------------------------------------------------------------- circles panel
   The cluster names used to be drawn on the canvas, where they were the widest
   thing on it, collided with the people they named, and still could not carry a
   roster. Off the map each one brings its members with it, and hovering a name
   is the only way to ask "who is in this" without reading nine labels.        */
var panelEl = slot('panel');
function memberRowsFor(key){
  return PEOPLE.filter(function(p){ return (p.circle||[]).indexOf(key) >= 0; })
               .sort(function(a,b){ return a.name.localeCompare(b.name); });
}
function ringColor(r){
  return r ? 'var(--'+(r==='family'?'fam':r)+')' : 'var(--none)';
}
function buildPanel(){
  if(!CHROME.panel || !panelEl) return;
  panelEl.textContent='';
  var inAny = {};
  CIRCLE_KEYS.forEach(function(key){
    var mem = memberRowsFor(key);
    if(!mem.length) return;
    var names = mem.map(function(p){ return p.name; });
    names.forEach(function(n){ inAny[n]=1; });

    var box = document.createElement('div');
    box.className = 'cgroup';

    var head = document.createElement('button');
    head.type='button'; head.className='chead';
    head.innerHTML = esc(key.toUpperCase())+' <span class="n">'+mem.length+'</span>';
    head.setAttribute('aria-label','Highlight the '+key+' circle, '+mem.length+' people');
    /* Hover AND focus, so the keyboard reaches the same thing the mouse does. */
    ['mouseenter','focus'].forEach(function(ev){
      head.addEventListener(ev, function(){ head.classList.add('on'); hotGroup(names); });
    });
    ['mouseleave','blur'].forEach(function(ev){
      head.addEventListener(ev, function(){ head.classList.remove('on'); hot(selected); });
    });
    box.appendChild(head);

    mem.forEach(function(p){
      var row = document.createElement('button');
      row.type='button'; row.className='cmem'; row.dataset.name=p.name;
      var ring = p.closeness || 'ring not asked';
      row.innerHTML = '<span class="dot" style="background:'+ringColor(p.closeness)+'"></span>'
                    + '<span class="nm">'+esc(p.name)+'</span>';
      row.title = p.name+' \u2014 '+ring;
      row.setAttribute('aria-label', p.name+', '+ring);
      ['mouseenter','focus'].forEach(function(ev){
        row.addEventListener(ev, function(){ hot(p.name); });
      });
      ['mouseleave','blur'].forEach(function(ev){
        row.addEventListener(ev, function(){ hot(selected); });
      });
      row.addEventListener('click', function(){ select(p.name); });
      box.appendChild(row);
    });
    panelEl.appendChild(box);
  });

  /* Said, not listed. Naming the count keeps the panel honest about the roster
     without turning a circle index into a 48-name scroll. */
  var loose = PEOPLE.filter(function(p){
    return p.relation!=='self' && !inAny[p.name];
  }).length;
  if(loose){
    var f=document.createElement('p');
    f.className='cnone';
    f.innerHTML='<b>'+loose+'</b> more people belong to no named circle. '
               +'They are on the map, tied to you.';
    panelEl.appendChild(f);
  }
}
function syncPanelSel(){
  if(!panelEl) return;
  var rows = panelEl.querySelectorAll('.cmem');
  for(var i=0;i<rows.length;i++)
    rows[i].classList.toggle('sel', rows[i].dataset.name===selected);
}
buildPanel();

/* ---- click anywhere to drop a pin ---------------------------------------
   Only when the pointer did NOT travel: the background is also the pan handle,
   and a pan that ends on empty canvas is not a request to clear the selection. */
svg.addEventListener('click', function(ev){
  if(suppressClick){ suppressClick=false; return; }
  if(ev.target === svg) deselect();
});
panelEl && panelEl.addEventListener('click', function(ev){
  if(ev.target === panelEl) deselect();
});
window.addEventListener('keydown', function(ev){
  if(ev.key === 'Escape') deselect();
});

/* ------------------------------------------------------------------ chrome */
(function(){
  var rings={inner:0,solid:0,orbit:0,family:0,belt:0};
  PEOPLE.forEach(function(p){ if(p.closeness) rings[p.closeness]++; });
  document.getElementById('meta').innerHTML =
    PEOPLE.length+' people &middot; '
    +(rings.inner+rings.solid+rings.orbit)+' ringed ('+rings.inner+' inner / '+rings.solid
    +' solid / '+rings.orbit+' orbit) &middot; '+rings.belt+' belt &middot; '+rings.family+' family';

  if(CHROME.legend && slot('legend')) slot('legend').innerHTML =
    ['<span><i class="sw" style="background:var(--inner)"></i>inner</span>',
     '<span><i class="sw" style="background:var(--solid)"></i>solid</span>',
     '<span><i class="sw" style="border:2px solid var(--orbit);background:var(--bg)"></i>orbit</span>',
     '<span><i class="sw" style="border:1px solid var(--belt);background:var(--bg)"></i>belt</span>',
     '<span><i class="sw" style="border:1.4px dashed var(--none)"></i>ring not asked</span>',
     '<span><i class="sw sq" style="background:var(--fam)"></i>family</span>',
     '<span><i style="border-top-color:var(--e-hl)"></i>shared highlight</span>',
     '<span><i style="border-top-color:var(--e-intro)"></i>introduced (directional)</span>',
     '<span><i style="border-top-color:var(--e-circle)"></i>same circle</span>',
     '<span><i style="border-top-color:var(--e-partner);border-top-width:3px"></i>partners</span>',
     '<span><i style="border-top-color:var(--e-manual);border-top-style:dashed"></i>manual link</span>',
     '<span><i style="border-top-color:var(--e-kyuwon)"></i>knows Kyuwon (everyone)</span>',
     '<span><i style="border-top-color:var(--e-nominal);border-top-style:dotted"></i>nominal / withheld</span>'
    ].join('');

  var noRing=PEOPLE.filter(function(p){return p.relation==='friend'&&!p.closeness;});
  var fam=PEOPLE.filter(function(p){return p.closeness==='family';});
  var noMetro=PEOPLE.filter(function(p){return p.relation!=='self'&&!p.metro;});
  var pend=PEOPLE.filter(function(p){return p.capture_status==='pending';});
  var part=PEOPLE.filter(function(p){return p.capture_status==='captured_partial';});
  var ec={}; edges.forEach(function(e){ ec[e.kind]=(ec[e.kind]||0)+1; });

  var h='';
  h+='<p><b>Unresolved names in highlight rosters:</b> '
    +(unresolved.length? '<span class="bad">'+unresolved.length+'</span><ul>'
        +unresolved.map(function(u){return '<li>'+esc(u.who)+'’s “'+esc(u.what)+'” names <code>'
        +esc(u.name)+'</code>, who is not in the roster and has no entry in <code>_schema.aliases</code>.</li>';}).join('')
        +'</ul>' : '<span class="ok">none</span> — all rosters resolve to roster keys.')+'</p>';
  if(problems.length){
    h+='<p><b class="bad">Grouping-key violations:</b><ul>'
      +problems.map(function(p){return '<li>'+esc(p.t)+': '+p.d+'</li>';}).join('')+'</ul></p>';
  } else {
    h+='<p><b>Grouping keys:</b> <span class="ok">clean</span> — every <code>circle</code> value is a key in '
      +'<code>_schema.circles</code> and every <code>metro</code> is a bare metro name. '
      +'Four prose-polluted keys were removed at v37; the renderer groups by string equality, so a parenthetical '
      +'silently forks a cluster.</p>';
  }
  h+='<p><b>Every node connects to Kyuwon</b>, because the roster is by construction people he knows &mdash; '
    +'his ruling, 2026-10-13. It is drawn as the faintest line on the canvas on purpose: <b>a universal edge is a '
    +'constant, so it discriminates nothing.</b> It is here because its <i>absence</i> lied &mdash; it used to be '
    +'drawn only for pendants and family, which made 20 people look unconnected to him. '
    +'<b>&ldquo;Pendant&rdquo; now means zero edges OTHER than his</b>, and '+pendants.length+' '
    +(pendants.length===1?'person is':'people are')+' in that position: '
    +(pendants.map(esc).join(', ')||'none')+'.</p>';
  var exc = SCHEMA.edge_exclusions||[];
  if(exc.length)
    h+='<p><b>Edges he has removed by hand</b> ('+exc.length+'): '
      +exc.map(function(x){ return '<code>'+x.pair.map(esc).join(' &ndash; ')+'</code>'; }).join(', ')
      +'. The derived model built these from a shared highlight and he says the friendship is not there &mdash; '
      +'both were at the event because they each came with him. <b>The highlight rosters are unchanged; only the '
      +'edge is suppressed.</b> A removed edge is invisible by definition, so it is listed here rather than '
      +'silently dropped.</p>';
  h+='<p><b>Edges by source</b> ('+edges.length+' total, all derived — none hand-drawn): '
    +Object.keys(ec).sort().map(function(k){return '<code>'+k+'</code> '+ec[k];}).join(' &middot; ')+'.</p>';
  h+='<p><b>Family is its own ring</b> ('+fam.length+'), not a reading on the inner/solid/orbit scale &mdash; '
    +'his instruction. They had been sitting at a NULL closeness, where null means <i>not asked</i>, while theirs '
    +'meant <i>not applicable</i>. <b>An empty cell is a claim; ask what it asserts before queuing work to fill '
    +'it.</b></p>';
  h+='<p><b>Coverage.</b> '
    +(noRing.length
      ? noRing.length+' friends have no ring, so the map draws them hollow and dashed and the rail cannot see '
        +'them: '+noRing.map(function(p){return esc(p.name);}).join(', ')+'. '
      : '<b>Every friend on the map has a ring.</b> ')
    +noMetro.length+' have no metro and sit in the “metro not asked” cluster in the Cities layout. '
    +pend.length+' records are <code>pending</code> and '+part.length+' are <code>captured_partial</code>.</p>';
  h+='<p><b>What this page deliberately does not show.</b> Message volume and call minutes are in '
    +'<code>_schema._analysis</code> and off the map at his instruction. They never drive a position, a size, an '
    +'order, or a ring — and the controlled pair is why: two people in the same circle, twenty messages apart in '
    +'volume, sit two rings apart.</p>';
  h+='<p><b>Known gaps in this renderer, named so they are not mistaken for passes.</b></p><ul>'
    +'<li><code>cadence</code> is free prose, keyword-matched to an interval. Any phrasing the matcher does not '
    +'recognise is reported in the rail as unscorable rather than scored at a guess.</li>'
    +'<li><code>channel</code> is captured but not yet used in scoring; the rail gates on <code>metro</code> only.</li>'
    +'<li>Open threads have no expiry. The rail shows days-open so a stale one is visible, but nothing ages it out '
    +'— that was flagged at v12 as a person problem, not a code one.</li>'
    +'<li>Nominal membership and a withheld introducer are drawn as ties into empty space, never as nodes. '
    +'A missing stub would look identical to “met directly”, and those are different facts.</li></ul>';
  if(CHROME.integrity && slot('integBody')) slot('integBody').innerHTML=h;
})();

buildRail();
})();
</script>
</body>
</html>
