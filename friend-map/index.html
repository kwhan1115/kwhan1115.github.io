<meta name="description" content="A hand-built map of one person's friendships, laid out by a force simulation with no libraries.">
<title>Friend Map &mdash; Kyuwon Han</title>
<style>
:root{
  --bg:#0d1013; --panel:#14181d; --panel2:#1a1f26; --line:#242b34;
  --ink:#e6e9ee; --ink2:#9aa5b4; --ink3:#5f6b7a;
  --inner:#ff6b5e; --solid:#f0b537; --orbit:#5aa9e6; --none:#4b5663;
  /* belt: the outermost ring. Cooler and dimmer than orbit so it reads as
     further out, but clearly brighter than --none, which now means only
     "no ring on record" rather than "the ones he hasn't got to". */
  --belt:#6b7a8f;
  --fam:#9b7ede; --self:#e6e9ee;
  --e-circle:#2b3642; --e-hl:#4b7fa8; --e-intro:#7a6bbf; --e-partner:#c45a84;
  --e-manual:#55606e; --e-kyuwon:#222a33; --e-nominal:#6b5a33; --e-stub:#6b5a33;
  --warn:#ff8a5e;
  --r:10px; --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  --sans:-apple-system,"Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px}
html,body{height:100%}
body{display:flex;flex-direction:column;overflow:hidden}
a{color:var(--orbit)}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}

.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
.topbar h1{font-size:15px}
.sens{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink2);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.meta{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink3);text-align:right;line-height:1.5}
.subbar{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;
  padding:9px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
.subbar p{margin:0;max-width:68ch;color:var(--ink2);line-height:1.45}
.key{display:flex;align-items:center;gap:13px;flex-wrap:wrap;margin-left:auto;
  font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2)}
.key span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
/* The topbar already wraps, but .meta keeps margin-left:auto and text-align:right
   when it does, so at phone width the line ran off the edge and the
   generated-at stamp -- the guard that makes a stale people.data.js visible
   rather than silent -- was the half that got clipped. Reflow it instead of
   hiding it. */
@media (max-width:860px){
  .meta{margin-left:0;width:100%;text-align:left;font-size:10px;line-height:1.45}
}

.toggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel2)}
.toggle button{appearance:none;border:0;background:transparent;color:var(--ink2);
  font:inherit;font-size:12px;font-weight:650;letter-spacing:.08em;padding:7px 16px;cursor:pointer}
.toggle button[aria-pressed=true]{background:var(--ink);color:#0d1013}
.toggle button:focus-visible{outline:2px solid var(--orbit);outline-offset:-2px}

.wrap{position:relative;flex:1 1 auto;min-height:0}
/* absolute, not grid+height:100%: a grid row sizes to CONTENT, so height:100%
   on the svg had nothing definite to resolve against and fell back to the
   viewBox aspect -- 1394px tall in an 897px window, and the page scrolled. */

.stage{position:absolute;inset:0;min-width:0}
/* the whole map must fit the first screen -- he opens this to find one person,
   not to scroll a graph. Letterboxes rather than cropping.
   HEIGHT IS DERIVED, NOT RESERVED: this was max-height:calc(100vh - 150px),
   where 150 was room for the legend and footer. Those came off on 2026-10-26
   and the constant went stale the same minute, leaving ~150px of dead space
   under the map. Body is a flex column, the map fills what the topbar leaves,
   and nothing has to be re-tuned the next time a strip is added or removed. */
svg.map{display:block;width:100%;height:100%;touch-action:manipulation}
/* ---- the circles panel -------------------------------------------------
   Cluster names left the canvas on 2026-10-30: at 11px, tracked, over a live
   force layout they were competing with the thing they described. Off the map
   a name can carry its roster as well, which the canvas never had room for. */
/* Positioned, not grid. The note on .stage is load-bearing: a grid row sizes
   to CONTENT, so height:100% on the svg resolved against nothing and fell back
   to the viewBox aspect -- 1394px tall in an 897px window. Insetting the stage
   from the left keeps the definite height that fix depends on. */
.wrap--panel .panel{position:absolute;left:0;top:0;bottom:0;width:264px}
.wrap--panel .stage{left:264px}
@media (max-width:860px){
  .wrap--panel .panel{left:0;right:0;top:0;bottom:auto;width:auto;height:38%;
    border-right:0;border-bottom:1px solid var(--line)}
  .wrap--panel .stage{left:0;top:38%}
}
.panel{
  overflow:auto; padding:18px 0 28px; border-right:1px solid var(--line);
  /* The scrollbar is part of the page. Left alone it ships the OS default,
     which belongs to no design here. */
  scrollbar-width:thin; scrollbar-color:#2a3038 transparent;
}
.panel::-webkit-scrollbar{width:9px}
.panel::-webkit-scrollbar-track{background:transparent}
.panel::-webkit-scrollbar-thumb{background:#2a3038;border-radius:999px}
.panel::-webkit-scrollbar-thumb:hover{background:#39414c}
/* Generous between groups, tight within one -- the grouping has to be legible
   before any single name is. */
.cgroup + .cgroup{margin-top:22px}
.chead{
  display:flex; align-items:baseline; gap:7px; width:100%;
  background:none; border:0; cursor:pointer; text-align:left;
  font-family:var(--mono); font-size:10.5px; font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink3);
  padding:5px 16px 7px; transition:color .12s ease;
}
.chead:hover,.chead.on{color:var(--ink)}
.chead .n{font-weight:400;opacity:.5;letter-spacing:.04em}
.cmem{
  display:flex; align-items:center; gap:9px; width:100%;
  background:none; border:0; cursor:pointer; text-align:left;
  font:inherit; font-size:12.5px; color:var(--ink2);
  padding:3px 16px; transition:color .12s ease,background .12s ease;
}
.cmem:hover{color:var(--ink);background:#1b2026}
.cmem.sel{color:var(--ink);background:#232a33}
/* Ring colour is a reminder, never the only carrier -- the dot has a title and
   every row is reachable and readable without it. */
.dot{width:7px;height:7px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px #0003}
.cmem.sel .dot{box-shadow:inset 0 0 0 1px #0003,0 0 0 2px #ffffff26}
.cnone{padding:16px 16px 0;margin-top:22px;border-top:1px solid var(--line);
  color:var(--ink3);font-size:11.5px;line-height:1.55}
.chead:focus-visible,.cmem:focus-visible{outline:2px solid var(--orbit);outline-offset:-2px}
.clabel{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;fill:var(--ink3);text-anchor:middle;pointer-events:none}
.clabel tspan.n{fill:var(--ink3);opacity:.6}
.nlabel{font-size:10.5px;fill:var(--ink2);text-anchor:middle;pointer-events:none}
.node{cursor:grab;touch-action:none}
.node:focus{outline:none}
.node:focus-visible .shape{stroke:#fff;stroke-width:3}
.node .shape{transition:stroke-width .12s,opacity .12s}
/* THE GRAB AREA IS NOT THE DRAWN AREA. A ringless person is drawn hollow
   (fill:none), and fill:none is not a hit target -- only the 1.4px stroke is.
   Measured 2026-10-27: 43 of 43 hollow nodes failed a hit test AT THEIR OWN
   CENTRE while 0 of 37 filled ones did, so over half the map could only be
   clicked or dragged on a hairline. `.hit` is an invisible disc that restores
   the target without touching the drawing. fill:transparent, never fill:none
   -- `none` is exactly the bug. */
.hit{fill:transparent;stroke:none}
/* ...AND THE SAME DEFECT HAD KILLED THE CIRCLE HANDLE OUTRIGHT. A cluster
   label carries pointer-events:none so its glyphs never steal a node's click,
   and the "drag a circle" pointerdown was attached to that very element -- a
   listener on something that cannot receive the event. It had never fired.
   The handle is now a group: an invisible rect takes the pointer, the text
   stays inert, and the rect IS the label's collision box, so the handle can
   never come to rest on top of a person. */
.chandle{cursor:grab;touch-action:none}
.chandle:focus{outline:none}
.chit{fill:transparent;stroke:none}
.chandle:focus-visible .clabel{fill:var(--ink);text-decoration:underline;text-underline-offset:3px}
.map.dragging,.map.dragging .node,.map.dragging .chandle{cursor:grabbing}
.map.dragging .nlabel{opacity:.55}
.node.sel .shape{stroke:#fff;stroke-width:3}
.node.dim{opacity:.22}
.edge{fill:none}
.edge.dim{opacity:.1}
.edge.hot{opacity:1}

.rail{border-left:1px solid var(--line);background:var(--panel);min-height:100%}
@media(max-width:1000px){.rail{border-left:0;border-top:1px solid var(--line)}}
.rail h2{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);
  padding:13px 16px 9px;border-bottom:1px solid var(--line)}
.ri{display:block;width:100%;text-align:left;appearance:none;background:transparent;border:0;
  border-bottom:1px solid var(--line);padding:11px 16px;cursor:pointer;color:inherit;font:inherit}
.ri:hover,.ri:focus-visible{background:var(--panel2);outline:none}
.ri .r1{display:flex;align-items:baseline;gap:8px}
.ri .nm{font-weight:650}
.ri .when{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink3);white-space:nowrap}
.ri .r2{font-size:12px;color:var(--ink2);margin-top:3px;line-height:1.45}
.badge{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;padding:2px 6px;border-radius:4px;white-space:nowrap}
.b-thread{background:#4a1c14;color:#ffbfae;border:1px solid #7a2e22}
.b-bday{background:#1c3a4a;color:#bfe3ff;border:1px solid #2d5e78}
.b-cad{background:#3f3419;color:#ffe6ae;border:1px solid #6b5a33}
.b-today{background:#ff6b5e;color:#2a0d08;border:1px solid #ff6b5e}
.ring{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.ring.inner{color:var(--inner)}.ring.solid{color:var(--solid)}
.ring.orbit{color:var(--orbit)}.ring.none{color:var(--none)}
.ring.belt{color:var(--belt)}
.ring.family{color:var(--fam)}

.cant{padding:11px 16px;font-size:11.5px;color:var(--ink3);line-height:1.6;border-bottom:1px solid var(--line)}
.cant b{color:var(--ink2);font-weight:650}

.card{border-top:1px solid var(--line);background:var(--panel);padding:0}
.card .hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:15px 18px 11px}
.card .hd h2{font-size:19px}
.card .hd .x{margin-left:auto;appearance:none;background:transparent;border:1px solid var(--line);
  color:var(--ink2);border-radius:6px;font:inherit;font-size:12px;padding:4px 10px;cursor:pointer}
.sect{padding:0 18px 14px;max-width:1120px}
.card .hd{max-width:1120px}
.sect h3{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);
  margin:14px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:5px 14px;align-items:baseline}
@media(max-width:620px){.kv{grid-template-columns:1fr}}
.kv dt{font-family:var(--mono);font-size:11px;color:var(--ink3);letter-spacing:.02em}
.kv dd{margin:0;line-height:1.55;overflow-wrap:anywhere}
.kv dd.prose{color:var(--ink2);font-size:13px}
.pill{display:inline-block;font-size:11.5px;background:var(--panel2);border:1px solid var(--line);
  border-radius:999px;padding:2px 9px;margin:0 5px 5px 0}
.pill.nom{border-style:dashed;color:var(--ink3)}
.thread{background:#1b1310;border:1px solid #4a2a1e;border-radius:var(--r);padding:12px 14px;line-height:1.55}
.thread .t1{font-size:11px;font-family:var(--mono);color:var(--warn);letter-spacing:.06em;
  text-transform:uppercase;margin-bottom:6px}
.prov{font-size:11px;color:var(--ink3);font-style:italic;margin-top:4px}
.empty{padding:28px 18px;color:var(--ink3);font-size:13px;line-height:1.6}

.foot{border-top:1px solid var(--line);background:var(--panel);padding:14px 18px 22px}
details{margin-top:8px}
details summary{cursor:pointer;font-size:12px;color:var(--ink2);font-weight:650}
details summary:focus-visible{outline:2px solid var(--orbit);outline-offset:2px}
.integ{margin-top:10px;font-size:12px;line-height:1.7;color:var(--ink2)}
.integ ul{margin:6px 0 12px;padding-left:20px}
.integ code{font-family:var(--mono);font-size:11px;color:var(--ink)}
.integ .ok{color:#6fd08c}.integ .bad{color:var(--warn);font-weight:650}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:11.5px;color:var(--ink2);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:22px;height:0;border-top-width:2px;border-top-style:solid;display:inline-block}
.sw{width:11px;height:11px;border-radius:50%;display:inline-block}
.sw.sq{border-radius:3px}
@media (max-width:860px){
  .wrap--panel .panel{top:auto;bottom:0;height:40%;
    border-right:0;border-top:1px solid var(--line);border-bottom:0}
  .wrap--panel .stage{left:0;top:0;bottom:40%}
  .subbar{padding:8px 16px;gap:9px}
  .subbar p{font-size:13px;line-height:1.42}
  .key{margin-left:0;gap:11px;font-size:10px}
}
</style>

<script>
(function(){
"use strict";
var D = window.FM_DATA;
var svg = document.getElementById('svg');

/* ONE SWITCH FOR THE PAGE'S CHROME. He asked for just the map on 2026-10-26;

   container to draw into. Flip any of these to true and re-add its element in
   the markup above to get it back -- nothing was deleted. */
/* PINNED BY build_public.py -- the card, rail, legend and integrity
   panels are the surfaces that render free text. The public build has
   no such text to render, and these stay false regardless of what the
   private page does. */
var CHROME = { rail:false, card:false, legend:false, integrity:false,
               /* Cluster names moved OFF the canvas 2026-10-30 -- flip to true
                  and the in-map labels (and the drag-a-circle handle that lives
                  on them) come back exactly as they were. Nothing deleted. */
               maplabels:false, panel:true };
function slot(id){ return document.getElementById(id); }

if(!D){
  /* the load failure still has to be SAYABLE with no rail to say it in */
  document.title = 'Friend Map — people.data.js did not load';
  var warn = document.createElement('div');
  warn.className = 'empty';
  warn.style.cssText = 'padding:24px 18px;color:var(--ink2)';
  warn.innerHTML = '<b>people.data.js did not load.</b><br>'+
    'Run <code>python regen.py</code> in this folder, then reload.';
  (slot('rail') || document.querySelector('.stage') || document.body).appendChild(warn);
  return;
}

/* ---------------------------------------------------------------- constants */
var W=1240, H=900, CX=620, CY=440;
var SCHEMA = D._schema, PEOPLE = D.people;
var CIRCLE_KEYS = Object.keys(SCHEMA.circles||{});
var byName = {}; PEOPLE.forEach(function(p){ byName[p.name]=p; });
var SELF = PEOPLE.filter(function(p){return p.relation==='self';})[0];
var TODAY = new Date(); TODAY.setHours(0,0,0,0);
var RING_R = {inner:13, solid:11, orbit:9, family:11, belt:7};

/* THE GRAB RADIUS IS ALSO THE COLLISION RADIUS, and that identity is the whole
   design. A hit pad wider than the gap between two people lets you grab the
   wrong one; a collision body wider than the pad spends room it does not need.
   So there is ONE number per person, used twice: `.hit` is drawn at it, and
   the separation solver treats the disc as that big. Two hit targets therefore
   cannot overlap however tight the layout gets -- not tuned, impossible.
   It also answers "a bit more separation": the smallest node's body goes
   10 -> 15, which pushed the closest pair from 2.5px of air to 12.3. The old
   +2 was a DE-OVERLAP margin, and a de-overlap margin is not a comfortable
   gap -- which is exactly why the layout read as clustered while measuring
   technically clean.
   DECLARED HERE, BESIDE RING_R, AND THE PLACEMENT IS LOAD-BEARING. These first
   lived down in the sim block, below the node builder. `function hitR` hoists,
   but `var HIT_PAD` hoists as UNDEFINED -- so every pad was created at
   r="NaN", measured 0x0 and did nothing, while the overlap check written to
   police them ran over zero-size circles and reported a clean 0. A detector
   that measures nothing reads exactly like a pass. */
var HIT_PAD = 5, HIT_MIN = 15;
function hitR(r){ return Math.max(r + HIT_PAD, HIT_MIN); }
/* The cluster handle's pad, same spirit: an 11px line of text is a 12px tall
   target, which is nothing to aim at. Vertical gets more than horizontal
   because the text is wide already and short always. */
var CHIT_X = 7, CHIT_Y = 9;

var problems = [];

function esc(s){ return String(s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function el(tag,attrs){ var n=document.createElementNS('http://www.w3.org/2000/svg',tag);
  for(var k in attrs) if(attrs[k]!=null) n.setAttribute(k,attrs[k]); return n; }
function first(s){ return String(s).split(/\s|\(/)[0]; }
/* The SAME event is written up differently on each participant's record --
   "Japan trip" on Bryan, "Japan, summer 2024 - the project's FIRST cross-circle
   highlight..." on Lily. Both are the same edge, so the label is cut back to
   its first clause and de-duplicated on its first word.                    */
function shortWhat(h){
  var w = String(h.what||'highlight').split(/\s+-\s+/)[0].split(',')[0].trim();
  return w.slice(0,44);
}
function whyKey(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim().split(' ')[0]; }

/* ------------------------------------------------------------------- edges
   DERIVED ONLY -- the three approved sources, plus the two explicit fields
   (partner_of v31, manual_edge v26). Nothing is hand-drawn here.            */
var edges = [], seen = {};
/* Hand-named SUBTRACTS: pairs the derived model invents and he says are not
   there. Counterpart of manual_edge, which is the hand-named ADD. Enforced
   inside addEdge so no edge source can route around it. */
var EXCL = {};
(SCHEMA.edge_exclusions||[]).forEach(function(x){
  EXCL[(x.pair||[]).slice().sort().join('~')] = x.why || 'excluded by him';
});
function addEdge(a,b,kind,why,dir){
  if(!a||!b||a===b) return;
  if(!byName[a]||!byName[b]) return;
  if(EXCL[[a,b].sort().join('~')]) return;
  var k = kind+'|'+[a,b].sort().join('~');
  if(seen[k]){
    if(why && !seen[k].why.some(function(x){ return whyKey(x)===whyKey(why); })) seen[k].why.push(why);
    return;
  }
  var e={a:a,b:b,kind:kind,why:why?[why]:[],dir:!!dir};
  seen[k]=e; edges.push(e);
}

/* (1) same circle -- real membership only. circle_nominal is excluded by
       design: a nominal member would get false edges to every active member. */
CIRCLE_KEYS.forEach(function(ck){
  var m = PEOPLE.filter(function(p){ return (p.circle||[]).indexOf(ck)>=0; }).map(function(p){return p.name;});
  for(var i=0;i<m.length;i++) for(var j=i+1;j<m.length;j++) addEdge(m[i],m[j],'circle',ck);
});
/* circles a person claims that are not in the registry = a forked cluster */
PEOPLE.forEach(function(p){ (p.circle||[]).forEach(function(c){
  if(CIRCLE_KEYS.indexOf(c)<0) problems.push({t:'circle key not in _schema.circles',d:p.name+' &rarr; <code>'+esc(c)+'</code>'});
}); });

/* (2) co-participation in a highlight */
var unresolved = [];
PEOPLE.forEach(function(p){
  (p.highlights||[]).forEach(function(h){
    var ros = (h['with']||[]).slice();
    var label = shortWhat(h);
    ros.forEach(function(n){
      if(!byName[n]){ unresolved.push({who:p.name,name:n,what:label}); return; }
      addEdge(p.name,n,'highlight',label);
    });
    for(var i=0;i<ros.length;i++) for(var j=i+1;j<ros.length;j++)
      if(byName[ros[i]]&&byName[ros[j]]) addEdge(ros[i],ros[j],'highlight',label);
  });
});

/* (3) introduced_by -- directional. Strictly a roster name since v37. */
PEOPLE.forEach(function(p){
  var ib = p.introduced_by;
  if(!ib) return;
  if(!byName[ib]){ problems.push({t:'introduced_by names a non-roster person',d:p.name+' &rarr; <code>'+esc(ib)+'</code>'}); return; }
  addEdge(ib,p.name,'intro','introduction',true);
});

/* explicit fields */
PEOPLE.forEach(function(p){
  if(p.partner_of && byName[p.partner_of]) addEdge(p.name,p.partner_of,'partner','partners');
  (p.manual_edge||[]).forEach(function(n){ if(byName[n]) addEdge(p.name,n,'manual','direct link, no named circle'); });
});

/* Degree is counted BEFORE the Kyuwon edges below, because every person gets
   one -- so "pendant" means zero edges OTHER than the one to him.            */
var deg = {}; PEOPLE.forEach(function(p){ deg[p.name]=0; });
edges.forEach(function(e){ deg[e.a]++; deg[e.b]++; });
var pendants = PEOPLE.filter(function(p){
  return p.relation!=='self' && deg[p.name]===0 && !(p.circle||[]).length && p.relation!=='family'; })
  .map(function(p){return p.name;});

/* KYUWON CONNECTS TO EVERYONE -- his ruling 2026-10-13: "Since I'm the central
   node, I should show up for everyone's connection. I didn't include anyone I'm
   not friends/acquainted with."
   The roster is, by construction, people he knows, so this edge is TRUE for all
   of them. It was previously drawn only for pendants and family, which made its
   ABSENCE read as "not connected to Kyuwon" -- false for 20 people.
   It is deliberately the faintest thing on the canvas: a universal edge is a
   constant, so it discriminates nothing. It is here because its absence lied,
   not because its presence is informative.                                   */
PEOPLE.forEach(function(p){
  if(p.relation==='self') return;
  if(p.relation==='family'){ addEdge(SELF.name,p.name,'family','family'); return; }
  addEdge(SELF.name,p.name,'kyuwon',
    deg[p.name]===0 ? 'he knows them \u2014 and this is their only edge' : 'he knows them');
});

/* nominal tie + withheld introducer stub: drawn to a PHANTOM anchor, never a node */
var ties = [];
PEOPLE.forEach(function(p){
  (p.circle_nominal||[]).forEach(function(ck){ ties.push({from:p.name,kind:'nominal',target:ck,
    why:'nominal member of '+ck+' &mdash; affiliation only, generates no edges'}); });
  if(p.introduced_by_status==='exists_unnamed_withheld')
    ties.push({from:p.name,kind:'stub',target:null,why:'introducer exists, name withheld by his choice'});
});

/* ------------------------------------------------------------------ layouts */
function clusterRadius(n){ return Math.max(44, Math.min(120, 26+8*n)); }
/* The thing that collides is the rendered NAME, not the node. ~5.6px per
   character at the 10.5px label size, measured off the real labels. */
function labelW(nm){ return String(nm).length * 5.6 + 6; }
var GRID_MIN = 9;   /* above this a ring cannot hold the labels -- use a grid */
function gridCols(k){ return 3; }   /* narrow and tall: labels are wide, rows are cheap */
function gridBox(list){
  var w = 0;
  list.forEach(function(nm){ w = Math.max(w, labelW(nm)); });
  return {cw: w + 16, ch: 50, cols: gridCols(list.length)};
}
function ringPos(cx,cy,r,i,n,a0){
  var a = (a0==null?-Math.PI/2:a0) + (n?2*Math.PI*i/n:0);
  return {x:cx+r*Math.cos(a), y:cy+r*Math.sin(a)};
}

/* signature layout: people are grouped by the SET of clusters they belong to,
   so a multi-circle person sits between their clusters rather than in one of
   them. The four Boys of Bell all hold {Boys of Bell, Iroh Fam}.
   NOTE: `centreMembersKey` is now UNREACHABLE -- CITIES was the only caller
   that passed one, and it stopped being a rosette on 2026-10-27 (see
   cityLayout). The branch is left standing because CIRCLES passes null, so it
   is inert, and because the R-derivation comment inside it is the record of
   why a fixed cluster distance could not survive the next capture. Do not
   revive it to lay out a group that holds a third of the roster -- the
   arithmetic for why that cannot fit is on cityLayout. */
function buildLayout(groupsOrder, groupOf, centreMembersKey, R, a0deg){
  var centres = {}, n = groupsOrder.length, cAng = [];
  /* R IS THE DISTANCE TO THE OUTER CLUSTERS AND IT WAS A FIXED NUMBER, while
     the CENTRE cluster's ring radius is max(92, k*15) and grows with its
     membership. Austin went 12 -> 15, its ring grew to 225, and the DFW grid
     sitting at a fixed 340 collided with it. The constant was correct for the
     membership it was chosen at -- the same scope error as the cluster-radius
     cap before it -- so derive the spacing from the data instead of picking a
     new number that will expire at the next capture. */
  if(centreMembersKey){
    var cmem = PEOPLE.filter(function(p){
      var gs = groupOf(p);
      return p.relation!=='self' && gs.length===1 && gs[0]===centreMembersKey; });
    if(cmem.length > 1){
      var wide = 0;
      cmem.forEach(function(p){ wide = Math.max(wide, labelW(p.name)); });
      R = Math.max(R, Math.max(92, cmem.length*15) + wide/2 + 120);
    }
  }
  /* ⚠ MEASURED BROKEN AT 79 RECORDS, 2026-10-26 - NOT YET FIXED, AND THE FIX IS
     NOT A CONSTANT. The pendant ring (people with no circle) sits at a fixed
     172/116 and fans laps across the angular gaps. That was right for the 7
     pendants it was written for; at 43 it yields 15 colliding name labels in
     BOTH layouts, measured with getBoundingClientRect against a planted
     positive control (16 -> 17), plus 1 cluster-label collision now that 9
     circles sit where 7 did (AXOLOTLE FAM on HIGH SCHOOL PERCUSSIONISTS).
     MECHANISM: the fan is +-0.44 rad while the gap is only 2pi/9 = 0.698 wide,
     so lap 3 overshoots into the neighbouring gap.
     WHY NO RADIUS FIXES IT: 43 labels at ~123px of arc each need r = 842 in a
     1240x900 field, and growing the canvas to fit shrinks every label to ~6px
     on screen. GRID_MIN already states the general law - "above this a ring
     cannot hold the labels" - and 43 pendants is that case; the pendant path
     has no grid escape. So this is an information-architecture choice about
     where ~40 circle-less people belong, not a spacing tweak, and it is HIS
     call: a pendant grid panel, a bigger canvas, or a toggle. Asked, not
     guessed. Do not "fix" this by picking a new radius - that is the exact
     error the comment above this one records. */
  groupsOrder.forEach(function(g,i){
    if(g===centreMembersKey){ centres[g]={x:CX,y:CY}; return; }
    var idx = groupsOrder.filter(function(x){return x!==centreMembersKey;}).indexOf(g);
    var m   = n - (centreMembersKey?1:0);
    var a   = (a0deg==null?-Math.PI/2:a0deg*Math.PI/180) + 2*Math.PI*idx/m;
    cAng.push(a);
    centres[g]={x:CX+R*Math.cos(a), y:CY+R*Math.sin(a)};
  });
  /* Pendants ride an inner ring, and they must not sit on a spoke pointing at
     a cluster -- the first pass put Fornia Van squarely on the Iroh Fam label.
     Place them in the ANGULAR GAPS between clusters instead.               */
  var gaps = cAng.map(function(a,i){
    var b = cAng[(i+1) % cAng.length];
    if(b < a) b += 2*Math.PI;
    return (a+b)/2;
  });

  var sigs = {};
  PEOPLE.forEach(function(p){
    if(p.relation==='self') return;
    var gs = groupOf(p);
    var key = gs.length? gs.slice().sort().join(' + ') : '\u0000pendant';
    (sigs[key] = sigs[key] || {gs:gs, list:[]}).list.push(p.name);
  });

  var pos = {};
  pos[SELF.name] = {x:CX,y:CY};

  Object.keys(sigs).sort().forEach(function(key){
    var s = sigs[key], list = s.list.slice().sort(), k = list.length, cx, cy, rad, a0;
    if(key.charCodeAt(0)===0){
      rad = centreMembersKey?172:116;
      list.forEach(function(nm,i){
        var g0  = gaps.length? gaps[i % gaps.length] : -Math.PI/2 + 2*Math.PI*i/k;
        var lap = Math.floor(i / Math.max(1, gaps.length));
        var fan = (lap % 2 ? 1 : -1) * Math.ceil(lap/2) * 0.44;
        var rr  = rad + lap*30;
        pos[nm] = {x: CX + rr*Math.cos(g0+fan), y: CY + rr*Math.sin(g0+fan),
                   up: Math.sin(g0+fan) < -0.02};
      });
      return;
    } else if(s.gs.length===1){
      var c=centres[s.gs[0]];
      cx=c.x; cy=c.y;
      rad = (s.gs[0]===centreMembersKey) ? Math.max(92, k*15) : clusterRadius(k);
      if(k===1) rad = Math.min(rad, 46);
      a0 = -Math.PI/2;
    } else {
      /* midpoint of the member clusters, pushed outward so it does not sit
         inside either one -- the Bell Boys genuinely belong to both.        */
      var sx=0, sy=0;
      s.gs.forEach(function(g){ sx+=centres[g].x; sy+=centres[g].y; });
      var mx=sx/s.gs.length, my=sy/s.gs.length;
      var dx=mx-CX, dy=my-CY, len=Math.sqrt(dx*dx+dy*dy)||1;
      cx = CX + dx/len*(len+104); cy = CY + dy/len*(len+104);
      rad = Math.max(34, Math.min(58, 20+9*k)); a0 = -Math.PI/2;
    }
    if(k===1){ pos[list[0]]={x:cx,y:cy,up:false}; return; }
    if(k >= GRID_MIN && s.gs[0] !== centreMembersKey){
      var g = gridBox(list), rows = Math.ceil(k/g.cols);
      var x0 = cx - (g.cols-1)*g.cw/2, y0 = cy - (rows-1)*g.ch/2;
      list.forEach(function(nm,i){
        pos[nm] = {x: x0 + (i % g.cols)*g.cw, y: y0 + Math.floor(i/g.cols)*g.ch, up:false};
      });
      return;
    }
    list.forEach(function(nm,i){
      var q = ringPos(cx,cy,rad,i,k,a0);
      /* name sits on the outward side of the ring, so adjacent names fan apart
         instead of stacking on one line */
      q.up = q.y < cy - 2;
      pos[nm]=q;
    });
  });

  /* A cluster label is placed above the CENTROID OF ITS ACTUAL MEMBERS, not
     above the geometric cluster centre. Boys of Bell is why: all four of its
     members also hold Iroh Fam, so they sit at the midpoint of the two and
     the geometric centre holds nobody -- a label there reads as a cluster of
     four that is visibly empty.                                            */
  var labels = [];
  groupsOrder.forEach(function(g){
    var mem  = PEOPLE.filter(function(p){ return groupOf(p).indexOf(g)>=0; });
    var solo = mem.filter(function(p){ return groupOf(p).length===1; });
    var m = (solo.length?solo:mem).map(function(p){ return pos[p.name]; }).filter(Boolean);
    if(!m.length) return;
    var sx=0, top=1e9, bx=0;
    m.forEach(function(q){ sx+=q.x; bx+=q.y; if(q.y<top) top=q.y; });
    labels.push({key:g, x:Math.max(90,Math.min(W-90,sx/m.length)),
                 y:Math.max(22,top-42), n:mem.length, mem:mem, solo:solo});
  });

  /* ---- cluster labels are placed against what is already there ----------
     The label went a fixed 42px above its topmost member and NOTHING EVER
     CHECKED WHAT WAS IN THAT SPACE. That held at six circles; the seventh
     re-angled every cluster centre and The Usual Suspects' label landed on
     two Iroh Fam nodes. Tuning the 42 is the wrong move -- the last layout
     failure here was a constant that could not exist (the radius cap went
     96 -> 150 -> 120 for 4 -> 1 -> 5 overlaps), and what fixed it was a
     deterministic rule. Same shape here: try ABOVE, and if that box hits a
     node label, take BELOW. Self-corrects the next time a circle is added. */
  function nodeR(p){ return p.relation==='self' ? 18 : (RING_R[p.closeness] || 8); }
  var nodeBoxes = PEOPLE.map(function(p){
    var q = pos[p.name]; if(!q) return null;
    var w = labelW(p.relation==='self' ? 'KYUWON' : p.name), r = nodeR(p);
    return {x1:q.x-w/2, x2:q.x+w/2, y1:q.y+r+5, y2:q.y+r+19};
  }).filter(Boolean);
  function clabelBox(l,y){
    var w = (l.key.length + String(l.n).length + 3) * 6.6;   /* 11px bold + .1em tracking */
    return {x1:l.x-w/2, x2:l.x+w/2, y1:y-10, y2:y+3};
  }
  /* ...AND AGAINST THE LABELS ALREADY PLACED. The rule above said it would
     "self-correct the next time a circle is added"; two were added at once
     (Axolotle Fam, High school Percussionists) and AXOLOTLE FAM landed on
     HIGH SCHOOL PERCUSSIONISTS -- because nHits only ever looked at NODE
     boxes. A label is a thing in that space too. Placed labels now join the
     obstacle set, so each one is laid against everything already there. */
  var placed = [];
  function nHits(b){
    var n=0;
    nodeBoxes.forEach(function(o){
      if(b.x1<o.x2 && o.x1<b.x2 && b.y1<o.y2 && o.y1<b.y2) n++; });
    placed.forEach(function(o){
      if(b.x1<o.x2 && o.x1<b.x2 && b.y1<o.y2 && o.y1<b.y2) n+=2; });  /* label on label reads worse */
    return n;
  }
  labels.forEach(function(l){
    var above = nHits(clabelBox(l,l.y));
    if(above){
      var bot = -1e9;
      (l.solo.length?l.solo:l.mem).forEach(function(p){
        var q=pos[p.name]; if(q && q.y+nodeR(p) > bot) bot = q.y+nodeR(p); });
      var yBelow = Math.min(H-14, bot+46);
      if(nHits(clabelBox(l,yBelow)) < above){ l.y = yBelow; l.below = true; above = nHits(clabelBox(l,l.y)); }
    }
    /* last resort: walk it clear vertically rather than leave it stacked */
    for(var step=1; above && step<=6; step++){
      var dy = (l.below?1:-1) * step * 15, y2 = l.y + dy;
      if(y2 < 18 || y2 > H-14) break;
      if(nHits(clabelBox(l,y2)) < above){ l.y = y2; above = nHits(clabelBox(l,y2)); }
    }
    placed.push(clabelBox(l, l.y));
  });

  /* phantom anchors for nominal ties: toward that circle's cluster centre */
  var anchors = {};
  groupsOrder.forEach(function(g){ anchors[g]=centres[g]; });
  return {pos:pos, labels:labels, anchors:anchors};
}

var LC = buildLayout(

    if(p.relation==='family') gs.push('Family');

var METROS = (function(){
  var m={}; PEOPLE.forEach(function(p){ if(p.relation==='self') return;
    m[p.metro||'— metro not asked']=1; });
  var ks=Object.keys(m).sort(function(a,b){
    if(a==='Austin') return -1; if(b==='Austin') return 1;
    if(a[0]==='—') return 1; if(b[0]==='—') return -1;
    return a.localeCompare(b); });
  return ks;
})();
/* ---- CITIES IS NOT A ROSETTE, AND ARITHMETIC SAYS IT CANNOT BE ONE -------
   buildLayout puts one cluster at the centre and rings the rest around it at
   radius R. That assumes the centre cluster is comparable in size to the
   others. In CITIES it is not: Austin holds 31 of 80 and DFW holds 29, so two
   of thirteen groups hold three quarters of the map.
   WHAT THAT COST, MEASURED ON THE PAGE: the centre ring is max(92, k*15),
   which is 450 at k=30 -- the full half-height of the field -- and R derives
   from it, so R was 621 and EIGHT OF TWELVE metro centres were born outside a
   1240x900 world. clampAll then pinned them to the border: 6 of 80 people in
   the middle 40% of the field, 12 in the corner boxes, 16 within 45px of an
   edge. A hollow donut. "way too separated, everything gets clustered in the
   corners" is exactly what that geometry produces.
   AND NO RADIUS FIXES IT. 29 name labels need ~117x56 each, so a DFW blob
   needs sqrt(29*117*56/pi) = 232 units of radius whatever shape it takes, and
   Austin needs the same. Nesting one inside a ring holding the other needs
   232 + 232 + a gap, against the 426 of vertical half-space that exists. Two
   blobs that size have to sit SIDE BY SIDE -- 464+464 fits across 1240 and
   fits nowhere concentric. So this is not a constant to re-pick (the comments
   in buildLayout record that error twice already); the topology was wrong.
   WHAT IT IS INSTEAD: every metro is a block -- a header over a grid of its
   members -- and the blocks are shelf-packed into the field, tallest first.
   A rectangle tiled with rectangles uses its middle by construction, which is
   the one thing a ring in a box can never do. Nothing here is a chosen
   distance: cell size comes from the widest name in that metro, a block's
   column count from its own aspect, and if the stack is taller than the field
   the tallest block WIDENS (more columns, fewer rows) until it fits. */
function cityLayout(groups, groupOf, homeKey){
  var M=14, GX=26, GY=18, HDR=34, CH=64;
  var AW=W-2*M, AH=H-2*M;
  /* CH IS NOT A LOOKS NUMBER, IT IS THE TWO FOOTPRINTS THAT ACTUALLY MEET.
     A row's name label ends at y + r + 15 + half the label box, and the pad of
     the node below starts at y + CH - hitR(r). At CH=56 that left an inner
     ring 0.5px of clearance -- so separate() had work to do in every cell of
     the map, and the measured result was not a grid at all: 40 distinct y
     bands instead of 8 rows, with the bottom row 130px short of its target.
     A pitch that merely avoids overlap is not a pitch that holds a grid. */

  var mem={};
  groups.forEach(function(g){ mem[g]=[]; });
  PEOPLE.forEach(function(p){
    var g=groupOf(p)[0];
    if(mem[g]) mem[g].push(p.name);          /* self included: he lives somewhere */
  });
  groups.forEach(function(g){ mem[g].sort(); });

  function headW(g){ return (g.length + String(mem[g].length).length + 3)*6.6 + 10; }
  function cellW(g){
    var w=0; mem[g].forEach(function(nm){ w=Math.max(w, labelW(nm)); });
    return w + 18;                            /* +18 so adjacent names clear by 8 */
  }
  var blocks = groups.map(function(g){
    var k=mem[g].length, cw=cellW(g);
    return {key:g, list:mem[g], k:k, cw:cw,
            cols:Math.max(1, Math.min(k, Math.round(Math.sqrt(k*CH/cw)))), hdr:headW(g)};
  });
  function size(b){
    b.rows=Math.ceil(b.k/b.cols);
    b.w=Math.max(b.cols*b.cw, b.hdr);         /* a block is at least its own header */
    b.h=HDR + b.rows*CH;
  }
  blocks.forEach(size);
  /* home metro first -- it gets the top left -- then biggest first, which is
     what every packer wants and also reads correctly: the big cities lead. */
  blocks.sort(function(a,b){
    if(a.key===homeKey) return -1;
    if(b.key===homeKey) return 1;
    return (b.w*b.h - a.w*a.h) || (b.k-a.k) || (a.key<b.key?-1:1);
  });

  /* GUILLOTINE FREE-RECTANGLE PACKING, and the one-pass shelf it replaces is
     why. Shelves spend a whole row's height on that row's tallest block:
     Austin and DFW are 476 and 544 wide, so they fill the width, and the
     eleven small metros were pushed into rows of their own below. Free rects
     let a one-person city use the 128px strip beside a 546-tall block, which
     is the difference between fitting in 872 and not fitting at all. */
  function pack(){
    var free=[{x:M,y:M,w:AW,h:AH}], bad=0;
    blocks.forEach(function(b){
      var best=-1, bs=1e18;
      for(var i=0;i<free.length;i++){
        var f=free[i];
        if(f.w < b.w || f.h < b.h) continue;
        var s=(f.w-b.w)+(f.h-b.h) + f.y*0.6 + f.x*0.2;   /* fit, then top-left */
        if(s < bs){ bs=s; best=i; }
      }
      if(best < 0){ bad++; b.x=M; b.y=M; return; }        /* reported, not hidden */
      var f=free[best];
      b.x=f.x; b.y=f.y;
      free.splice(best,1);
      if(f.w - b.w - GX > 0) free.push({x:f.x+b.w+GX, y:f.y, w:f.w-b.w-GX, h:b.h});
      if(f.h - b.h - GY > 0) free.push({x:f.x, y:f.y+b.h+GY, w:f.w, h:f.h-b.h-GY});
    });
    return bad;
  }
  var bad=pack(), guard=0;
  /* Something did not fit? WIDEN THE TALLEST BLOCK -- more columns is fewer
     rows -- and pack again. Terminates at cols===k, and it is the same move
     GRID_MIN already stands for: above some size a shape cannot hold its
     labels, so change the shape rather than pick a new number. This is what
     keeps the layout honest at 120 records without anyone editing it. */
  while(bad && guard++ < 80){
    var tall=null;
    blocks.forEach(function(b){
      if(b.rows>1 && b.cols<b.k && (!tall || b.h>tall.h)) tall=b; });
    if(!tall) break;
    tall.cols++; size(tall); bad=pack();
  }
  if(bad) console.warn('cityLayout: '+bad+' metro block(s) could not be placed');

  /* centre whatever the packer used, so the map is not top-left heavy */
  var x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;
  blocks.forEach(function(b){
    if(b.x<x1)x1=b.x; if(b.y<y1)y1=b.y;
    if(b.x+b.w>x2)x2=b.x+b.w; if(b.y+b.h>y2)y2=b.y+b.h; });
  var ox=(W-(x2-x1))/2 - x1, oy=(H-(y2-y1))/2 - y1;

  var pos={}, labels=[], anchors={};
  blocks.forEach(function(b){
    b.x+=ox; b.y+=oy;
    var gx0 = b.x + (b.w - (b.cols-1)*b.cw)/2;
    var cy0 = b.y + HDR + CH/2;
    var cells = b.list.map(function(nm,i){
      return {nm:nm, x: gx0 + (i%b.cols)*b.cw, y: cy0 + Math.floor(i/b.cols)*CH};
    });
    /* HE SITS IN HIS CITY, IN THE MIDDLE OF IT. The centre of the canvas
       belongs to a block now, so (CX,CY) is no longer a seat -- it is whatever
       the packing lands there, which could be a metro of one. Austin is where
       he is, so Austin is where he goes, and he takes the cell nearest that
       block's centre. In CIRCLES he is still pinned to the middle; this is the
       cities layout's answer, not a new rule about him. */
    if(SELF && b.list.indexOf(SELF.name)>=0 && cells.length){
      var bcx=b.x+b.w/2, bcy=b.y+HDR+b.rows*CH/2, bi=0, bd=1e9;
      cells.forEach(function(c,i){
        var d=(c.x-bcx)*(c.x-bcx)+(c.y-bcy)*(c.y-bcy);
        if(d<bd){ bd=d; bi=i; } });
      var si=b.list.indexOf(SELF.name);
      var swap=cells[si].nm; cells[si].nm=cells[bi].nm; cells[bi].nm=swap;
    }
    cells.forEach(function(c){ pos[c.nm]={x:c.x, y:c.y, up:false}; });
    anchors[b.key]={x:b.x+b.w/2, y:b.y+b.h/2};
    var memP = b.list.map(function(nm){ return byName[nm]; }).filter(Boolean);
    labels.push({key:b.key, x:b.x+b.w/2, y:b.y+HDR-10, n:b.k, mem:memP, solo:memP});
  });
  return {pos:pos, labels:labels, anchors:anchors};
}

function syncLabels(L){

  /* With the names in the panel, the map draws none -- and LAB stays EMPTY,
     which is the part that matters beyond the pixels: a cluster label was the

     the people. The layout still computes L.labels; only the drawing and the
